<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>夜宴 -NIGHT REVEL-</title>
<style>
  :root{
    --void:#0a0910;
    --void-deep:#050409;
    --blood:#c81e3a;
    --blood-bright:#ef4a5f;
    --moss:#7fbf3f;
    --moss-dim:#4f7d28;
    --moon:#a99bd8;
    --moon-dim:#5e5480;
    --bone:#e8e2d4;
    --amber:#e0a340;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--void-deep);
    overflow:hidden;
    font-family: Georgia, 'Times New Roman', serif;
    color:var(--bone);
    user-select:none;
  }
  #wrap{
    position:relative; width:100%; height:100vh; height:100dvh;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse at 50% 30%, #1a1424 0%, var(--void) 55%, var(--void-deep) 100%);
  }
  #stage{
    position:relative;
    width:100%; height:100%;
    max-width:960px; max-height:960px;
    aspect-ratio:1/1;
    margin:auto;
  }
  canvas{
    display:block;
    width:100%; height:100%;
    background:var(--void);
    border-radius:2px;
    box-shadow: 0 0 0 1px rgba(169,155,216,0.15), 0 0 60px rgba(0,0,0,0.6) inset;
  }

  /* ---------- HUD ---------- */
  #hud{
    position:absolute; top:0; left:0; right:0;
    padding:14px 16px 0;
    pointer-events:none;
    display:flex; flex-direction:column; gap:6px;
    z-index:31;
  }
  .bar-row{ display:flex; align-items:center; gap:8px; }
  .bar-label{
    font-family: 'Courier New', monospace;
    font-size:11px; letter-spacing:1px; color:var(--moon-dim);
    width:20px; text-align:center; flex-shrink:0;
  }
  .bar-track{
    flex:1; height:10px; background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    position:relative; overflow:hidden;
  }
  .bar-fill{ height:100%; width:0%; transition:width .18s ease; }
  #hpFill{ background:linear-gradient(90deg,#7a1223,var(--blood-bright)); }
  #xpFill{ background:linear-gradient(90deg,var(--moss-dim),var(--moss)); }
  .bar-ticks{ position:absolute; inset:0; pointer-events:none; }
  .bar-ticks .tick{
    position:absolute; top:0; bottom:0; width:1px;
    background:rgba(0,0,0,0.35);
  }

  /* ---------- 低HP時の危険オーラ(画面端ビネット) ---------- */
  #dangerVignette{
    position:absolute; inset:0;
    z-index:4;
    pointer-events:none;
    opacity:0;
    background: radial-gradient(ellipse at center,
      rgba(200,20,30,0) 45%,
      rgba(200,20,30,0.35) 75%,
      rgba(160,10,20,0.75) 100%);
    transition: opacity .35s ease;
  }
  #dangerVignette.pulse{
    animation: dangerPulse 1s ease-in-out infinite;
  }
  @keyframes dangerPulse{
    0%,100%{ filter:brightness(1); }
    50%{ filter:brightness(1.35); }
  }

  #topInfo{
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:'Courier New', monospace;
  }
  #clock{
    font-size:20px; letter-spacing:2px; color:var(--bone);
    text-shadow:0 0 8px rgba(169,155,216,0.5);
  }
  #lvl{
    font-size:13px; color:var(--amber);
  }

  /* ---------- unique augment indicators ---------- */
  #uniqueBar{
    display:flex; gap:8px;
    margin:5px 0 4px;
    pointer-events:auto;
  }
  .unique-slot{
    position:relative;
    width:32px; height:32px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(10,9,16,0.65);
    border:1px solid rgba(255,255,255,0.15);
    filter:grayscale(1);
    opacity:0.32;
    transition:all .2s ease;
  }
  .unique-slot.active{
    filter:none;
    opacity:1;
    border-color:#7fd1c9;
    box-shadow:0 0 9px rgba(127,209,201,0.45);
    cursor:pointer;
  }
  .unique-icon{ font-size:16px; color:var(--bone); }
  .unique-tip{
    display:none;
    position:absolute;
    top:38px; left:0;
    width:200px;
    background:rgba(8,7,13,0.96);
    border:1px solid rgba(127,209,201,0.4);
    box-shadow:0 8px 24px rgba(0,0,0,0.5);
    padding:9px 11px;
    font-family:'Courier New', monospace;
    font-size:10.5px;
    line-height:1.6;
    color:#c9c1d6;
    z-index:9;
  }
  .unique-slot.active:hover .unique-tip,
  .unique-slot.active.tapped .unique-tip{
    display:block;
  }
  .ut-title{
    font-family:Georgia, serif;
    font-size:11px; color:#7fd1c9;
    margin-bottom:4px;
  }

  /* ---------- overlays ---------- */
  .overlay{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    background:radial-gradient(ellipse at 50% 40%, rgba(20,14,30,0.92), rgba(5,4,9,0.97));
    z-index:20;
    text-align:center;
    padding:24px;
  }
  .hidden{ display:none !important; }

  .title-main{
    font-size:clamp(34px,8vw,58px);
    letter-spacing:6px;
    color:var(--bone);
    margin:0;
    text-shadow: 0 0 24px rgba(200,30,58,0.55), 0 0 2px #000;
    font-weight:normal;
  }
  .title-main.clear{
    color:#fff3c4;
    text-shadow: 0 0 34px rgba(255,215,120,0.85), 0 0 4px #000;
  }
  .title-sub{
    font-family:'Courier New', monospace;
    font-size:12px; letter-spacing:4px; color:var(--moon);
    margin-top:6px; text-transform:uppercase;
  }
  .title-flavor{
    max-width:360px; margin:22px 0 6px;
    font-size:14px; line-height:1.9; color:#b9b0c6;
  }
  .divider{
    width:60px; height:1px; background:var(--blood);
    margin:22px 0; opacity:0.7;
  }
  .ctrl-hint{
    font-family:'Courier New', monospace;
    font-size:11px; letter-spacing:1px; color:var(--moon-dim);
    line-height:1.8;
  }
  #charSelect{
    display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
    margin-top:20px;
    max-width:360px;
  }
  .char-card{
    width:100px;
    border:1px solid rgba(169,155,216,0.3);
    background:rgba(255,255,255,0.02);
    padding:12px 8px;
    cursor:pointer;
    transition:all .2s ease;
  }
  .char-card .char-icon{
    font-size:22px; margin-bottom:6px;
  }
  .char-card .char-name{
    font-size:11px; color:var(--bone); letter-spacing:1px;
    margin-bottom:6px;
  }
  .char-card .char-desc{
    font-family:'Courier New', monospace;
    font-size:9px; color:var(--moon-dim); line-height:1.5;
  }
  .char-card:hover{
    border-color:rgba(169,155,216,0.6);
    background:rgba(169,155,216,0.06);
  }
  .char-card.selected{
    border-color:var(--char-color, var(--amber));
    box-shadow:0 0 16px var(--char-color, rgba(224,163,64,0.4));
    background:rgba(255,255,255,0.04);
  }
  .char-card.selected .char-name{
    color:var(--char-color, var(--amber));
  }
  #versionTag, #versionTagOver{
    margin-top:10px;
    font-family:'Courier New', monospace;
    font-size:10px; letter-spacing:1px;
    color:var(--moon-dim);
    opacity:0.55;
  }

  button.action{
    margin-top:26px;
    background:transparent;
    border:1px solid var(--blood);
    color:var(--bone);
    font-family:Georgia, serif;
    font-size:16px;
    letter-spacing:3px;
    padding:12px 34px;
    cursor:pointer;
    position:relative;
    transition:all .25s ease;
  }
  button.action:hover, button.action:active{
    background:var(--blood);
    box-shadow:0 0 26px rgba(200,30,58,0.55);
  }
  button.action:disabled{
    opacity:0.35; cursor:default;
    background:transparent; box-shadow:none;
  }

  #resultScoreLabel{
    font-family:'Courier New', monospace;
    font-size:11px; letter-spacing:4px; color:var(--moon-dim);
    margin-top:18px;
  }
  #resultScore{
    font-family:'Courier New', monospace;
    font-size:46px; font-weight:bold; color:var(--bone);
    letter-spacing:2px;
    text-shadow:0 0 22px rgba(224,163,64,0.5);
  }
  #resultTime{
    font-family:'Courier New', monospace;
    font-size:20px; color:var(--amber); margin:10px 0 2px;
    letter-spacing:2px;
  }
  #resultLine{
    font-size:13px; color:#b9b0c6; margin-bottom:4px;
  }
  #resultStats{
    margin-top:6px;
    font-family:'Courier New', monospace;
    font-size:11.5px;
    color:#9c93ab;
    line-height:1.8;
    text-align:center;
  }
  #resultTrophies{
    margin-top:16px;
    width:280px;
    border-top:1px dashed rgba(169,155,216,0.25);
    padding-top:12px;
    text-align:left;
  }
  #resultTrophies .rt-title{
    font-family:'Courier New', monospace;
    font-size:11px; letter-spacing:2px; color:var(--moon-dim);
    margin-bottom:10px; text-align:center;
  }
  .result-trophy-row{
    display:flex; flex-wrap:wrap; justify-content:center;
    gap:8px;
  }

  /* ---------- level up ---------- */
  #levelUp{
    z-index:30;
    background:rgba(5,4,9,0.88);
  }
  #luTitle{
    font-size:24px; letter-spacing:4px; color:var(--amber);
    margin:0 0 22px;
    text-shadow:0 0 18px rgba(224,163,64,0.5);
  }
  #luNote{
    font-family:'Courier New', monospace;
    font-size:12px; letter-spacing:1px; color:var(--amber);
    margin:-14px 0 22px;
    opacity:0.9;
  }
  #levelUp.milestone{
    background:radial-gradient(ellipse at 50% 40%, rgba(60,42,14,0.4), rgba(5,4,9,0.97));
  }
  #levelUp.milestone #luTitle{
    color:#f2c568;
    text-shadow:0 0 26px rgba(224,163,64,0.75), 0 0 4px rgba(224,163,64,0.9);
  }
  #levelUp.milestone .choice{
    border-color:var(--amber);
  }
  #levelUp.milestone .choice:hover, #levelUp.milestone .choice:active{
    border-color:#f2c568;
    background:rgba(224,163,64,0.14);
  }
  #levelUp.bonus{
    background:radial-gradient(ellipse at 50% 40%, rgba(24,46,16,0.4), rgba(5,4,9,0.97));
  }
  #levelUp.bonus #luTitle{
    color:var(--moss);
    text-shadow:0 0 26px rgba(127,191,63,0.7), 0 0 4px rgba(127,191,63,0.9);
  }
  #levelUp.bonus #luNote{
    color:var(--moss);
  }
  #levelUp.bonus .choice{
    border-color:var(--moss-dim);
  }
  #levelUp.bonus .choice:hover, #levelUp.bonus .choice:active{
    border-color:var(--moss);
    background:rgba(127,191,63,0.14);
  }
  #levelUp.archfiend{
    background:radial-gradient(ellipse at 50% 40%, rgba(58,10,18,0.55), rgba(5,4,9,0.98));
  }
  #levelUp.archfiend #luTitle{
    color:#ff2d55;
    text-shadow:0 0 30px rgba(255,45,85,0.8), 0 0 6px rgba(255,45,85,0.9);
  }
  #levelUp.archfiend #luNote{
    color:#ff6b8a;
  }
  #levelUp.archfiend .choice{
    border-color:#ff2d55;
  }
  #levelUp.archfiend .choice:hover, #levelUp.archfiend .choice:active{
    border-color:#ff6b8a;
    background:rgba(255,45,85,0.14);
  }
  #luChoices{
    display:flex; gap:14px; flex-wrap:wrap; justify-content:center;
    max-width:640px;
  }
  .choice{
    width:170px;
    border:1px solid var(--moon-dim);
    background:linear-gradient(180deg, rgba(169,155,216,0.06), transparent);
    padding:18px 14px;
    cursor:pointer;
    transition:all .2s ease;
    text-align:left;
  }
  .choice:hover, .choice:active{
    border-color:var(--moon);
    background:rgba(169,155,216,0.14);
    transform:translateY(-2px);
  }
  .choice-icon{ font-size:22px; margin-bottom:6px; display:block; }
  .choice-stars{
    font-size:11px; letter-spacing:2px; color:var(--moon-dim);
    margin-bottom:6px;
  }
  .choice-name{
    font-size:14px; color:var(--bone); margin-bottom:6px; letter-spacing:1px;
  }
  .choice-desc{
    font-family:'Courier New', monospace;
    font-size:11px; color:var(--moon); line-height:1.6;
  }
  .choice.rarity-1{ border-color:var(--moon-dim); }
  .choice.rarity-1 .choice-stars{ color:var(--moon-dim); }
  .choice.rarity-2{ border-color:var(--amber); }
  .choice.rarity-2 .choice-stars{ color:var(--amber); }
  .choice.rarity-2:hover, .choice.rarity-2:active{
    border-color:#f2c568; background:rgba(224,163,64,0.12);
  }
  .choice.rarity-3{
    border-color:var(--blood-bright);
    box-shadow:0 0 14px rgba(239,74,95,0.22);
  }
  .choice.rarity-3 .choice-stars{ color:var(--blood-bright); }
  .choice.rarity-3 .choice-name{
    color:#ffdada;
    text-shadow:0 0 10px rgba(239,74,95,0.5);
  }
  .choice.rarity-3:hover, .choice.rarity-3:active{
    border-color:#ff7a8c; background:rgba(239,74,95,0.14);
    box-shadow:0 0 22px rgba(239,74,95,0.4);
  }
  .choice.rarity-4{
    border-color:#c9a6ff;
    box-shadow:0 0 18px rgba(201,166,255,0.32);
  }
  .choice.rarity-4 .choice-stars{ color:#c9a6ff; }
  .choice.rarity-4 .choice-name{
    color:#ecdcff;
    text-shadow:0 0 12px rgba(201,166,255,0.6);
  }
  .choice.rarity-4:hover, .choice.rarity-4:active{
    border-color:#dcc4ff; background:rgba(201,166,255,0.14);
    box-shadow:0 0 26px rgba(201,166,255,0.45);
  }
  .choice-unique{
    margin-top:8px;
    font-family:'Courier New', monospace;
    font-size:9px; letter-spacing:1px;
    color:#7fd1c9;
    border-top:1px dashed rgba(127,209,201,0.35);
    padding-top:6px;
  }

  /* ---------- touch controls ---------- */
  #stick{
    position:absolute; left:22px; bottom:22px;
    width:110px; height:110px; border-radius:50%;
    border:1px solid rgba(169,155,216,0.35);
    background:rgba(255,255,255,0.03);
    z-index:8; touch-action:none;
    display:none;
  }
  #stickKnob{
    position:absolute; width:46px; height:46px; border-radius:50%;
    background:rgba(169,155,216,0.35);
    border:1px solid rgba(169,155,216,0.6);
    left:32px; top:32px;
    pointer-events:none;
  }
  @media (hover:none) and (pointer:coarse){
    #stick{ display:block; }
  }

  /* ---------- status icon / stats overlay ---------- */
  #statusWrap{
    position:absolute; right:14px; bottom:14px;
    z-index:31;
  }
  #statusIcon{
    width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(10,9,16,0.72);
    border:1px solid rgba(169,155,216,0.4);
    color:var(--moon);
    font-size:18px;
    cursor:pointer;
    transition: all .2s ease;
    user-select:none;
  }
  #statusIcon:hover, #statusWrap.active #statusIcon{
    border-color:var(--amber);
    color:var(--amber);
    box-shadow:0 0 14px rgba(224,163,64,0.35);
  }
  #statusPanel{
    display:block;
    position:absolute;
    right:0; bottom:50px;
    width:212px;
    max-height:340px;
    overflow-y:auto;
    background:rgba(8,7,13,0.55);
    border:1px solid rgba(169,155,216,0.18);
    box-shadow:0 8px 28px rgba(0,0,0,0.35);
    padding:12px 14px;
    font-family:'Courier New', monospace;
    opacity:0.4;
    pointer-events:auto;
    transition: opacity .2s ease, background .2s ease, border-color .2s ease;
  }
  #statusPanel::-webkit-scrollbar{
    width:6px;
  }
  #statusPanel::-webkit-scrollbar-track{
    background:transparent;
  }
  #statusPanel::-webkit-scrollbar-thumb{
    background:rgba(169,155,216,0.35);
  }
  #statusPanel:hover,
  #statusWrap:hover #statusPanel,
  #statusWrap.active #statusPanel{
    opacity:0.98;
    background:rgba(8,7,13,0.94);
    border-color:rgba(169,155,216,0.3);
  }
  .sp-title{
    font-family:Georgia, serif;
    font-size:12px; letter-spacing:2px; color:var(--amber);
    margin-bottom:8px; padding-bottom:6px;
    border-bottom:1px solid rgba(169,155,216,0.2);
  }
  .sp-grid{
    display:grid; grid-template-columns:1fr auto; gap:4px 10px;
    font-size:11px; color:#c9c1d6;
  }
  .sp-grid span:nth-child(odd){ color:var(--moon-dim); }
  .sp-grid span:nth-child(even){ color:var(--bone); text-align:right; }

  /* ---------- enrage alert (5min mark) ---------- */
  #enrageAlert{
    position:absolute; top:14%; left:50%;
    transform:translate(-50%,-10px);
    z-index:31;
    text-align:center;
    pointer-events:none;
    opacity:0;
    transition: opacity .6s ease, transform .6s ease;
  }
  #enrageAlert.show{
    opacity:1;
    transform:translate(-50%,0);
  }
  #enrageAlert .ea-line1{
    font-size:clamp(24px,6vw,38px);
    color:var(--blood-bright);
    letter-spacing:6px;
    text-shadow:0 0 22px rgba(239,74,95,0.7), 0 0 4px #000;
  }
  #enrageAlert .ea-line2{
    margin-top:6px;
    font-family:'Courier New', monospace;
    font-size:12px; letter-spacing:1px; color:#e0a8b0;
  }
  .bar-track.enraged{
    animation: enragePulse 1.1s ease-in-out infinite;
  }
  @keyframes enragePulse{
    0%,100%{ box-shadow: 0 0 0 rgba(200,30,58,0); border-color: rgba(255,255,255,0.12); }
    50%{ box-shadow: 0 0 10px rgba(239,74,95,0.6); border-color: rgba(239,74,95,0.7); }
  }

  /* ---------- trophies ---------- */
  #trophyBar{
    position:absolute;
    bottom:14px; left:50%;
    transform:translateX(-50%);
    display:flex; flex-wrap:wrap; justify-content:center;
    gap:7px;
    max-width:min(340px, 80%);
    z-index:7;
  }
  .trophy-slot{
    position:relative;
    width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(10,9,16,0.72);
    border:1px solid var(--moon-dim);
    cursor:pointer;
    transition: all .2s ease;
  }
  .trophy-slot.locked{
    border-color:rgba(255,255,255,0.12);
    filter:grayscale(1);
    opacity:0.5;
  }
  .trophy-slot:not(.locked){
    border-color:var(--amber);
    box-shadow:0 0 10px rgba(224,163,64,0.3);
  }
  .trophy-slot.maxed{
    border-color:#fff3c4;
    box-shadow:0 0 14px rgba(255,243,196,0.7), 0 0 26px rgba(255,215,120,0.4);
    animation: trophyMaxedShine 1.8s ease-in-out infinite;
  }
  .trophy-slot.maxed .trophy-star{
    color:#fff3c4;
    text-shadow:0 0 8px rgba(255,243,196,0.9);
  }
  @keyframes trophyMaxedShine{
    0%,100%{ filter:brightness(1); }
    50%{ filter:brightness(1.5); }
  }
  .trophy-icon{ font-size:13px; color:var(--bone); }
  .trophy-star{
    position:absolute; bottom:-9px; left:50%; transform:translateX(-50%);
    font-size:8px; letter-spacing:1px; color:var(--amber);
    white-space:nowrap;
    text-shadow:0 0 4px rgba(224,163,64,0.6);
  }
  .trophy-tip{
    display:none;
    position:absolute;
    bottom:46px; left:50%; transform:translateX(-50%);
    width:190px;
    background:rgba(8,7,13,0.96);
    border:1px solid rgba(169,155,216,0.3);
    box-shadow:0 8px 24px rgba(0,0,0,0.5);
    padding:10px 12px;
    font-family:'Courier New', monospace;
    font-size:10.5px;
    line-height:1.6;
    text-align:left;
    color:#c9c1d6;
  }
  .trophy-slot:hover .trophy-tip,
  .trophy-slot.active .trophy-tip{
    display:block;
  }
  .tt-title{
    font-family:Georgia, serif;
    font-size:11.5px; color:var(--amber);
    margin-bottom:4px;
  }
  .tt-next{
    margin-top:4px; color:var(--moon-dim);
  }
  #trophyToast{
    position:absolute; top:8%; left:50%;
    transform:translate(-50%,-8px);
    z-index:17;
    background:rgba(8,7,13,0.92);
    border:1px solid var(--amber);
    box-shadow:0 0 20px rgba(224,163,64,0.35);
    padding:9px 18px;
    font-family:'Courier New', monospace;
    font-size:12px;
    color:#f2c568;
    white-space:nowrap;
    opacity:0;

  const ctx = canvas.getContext('2d');
  let W=0,H=0,DPR=1;

  function resize(){
    const rect = canvas.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = rect.width; H = rect.height;
    canvas.width = Math.floor(W*DPR);
    canvas.height = Math.floor(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);

  // ---------- input ----------
  const keys = {};
  window.addEventListener('keydown', e=>{
    keys[e.key.toLowerCase()]=true;
    if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
  });
  window.addEventListener('keyup', e=> keys[e.key.toLowerCase()]=false);

  let touchVec = {x:0,y:0};
  const stick = document.getElementById('stick');
  const knob = document.getElementById('stickKnob');
  let stickActive=false, stickId=null, stickOrigin={x:0,y:0};
  function stickReset(){
    knob.style.left='32px'; knob.style.top='32px';
    touchVec.x=0; touchVec.y=0;
  }
  stick.addEventListener('touchstart', e=>{
    e.preventDefault();
    const t = e.changedTouches[0];
    stickActive=true; stickId=t.identifier;
    const r = stick.getBoundingClientRect();
    stickOrigin = {x:r.left+r.width/2, y:r.top+r.height/2};
  }, {passive:false});
  window.addEventListener('touchmove', e=>{
    if(!stickActive) return;
    for(const t of e.changedTouches){
      if(t.identifier!==stickId) continue;
      e.preventDefault();
      let dx = t.clientX-stickOrigin.x, dy=t.clientY-stickOrigin.y;
      const max=40;
      const dist = Math.hypot(dx,dy);
      if(dist>max){ dx=dx/dist*max; dy=dy/dist*max; }
      knob.style.left = (32+dx)+'px';
      knob.style.top = (32+dy)+'px';
      touchVec.x = dx/max; touchVec.y = dy/max;
    }
  }, {passive:false});
  window.addEventListener('touchend', e=>{
    for(const t of e.changedTouches){
      if(t.identifier===stickId){ stickActive=false; stickId=null; stickReset(); }
    }

  const trophyToastQueue = [];
  let trophyToastBusy = false;
  function queueTrophyToast(key, tierIdx){
    const def = TROPHIES[key];
    const tier = def.tiers[tierIdx];
    trophyToastQueue.push(`🏆 ${def.label} ★${tierIdx+1} 獲得 ― ${tier.name}(${tier.bonusText})`);
    if(!trophyToastBusy) showNextTrophyToast();
  }
  function showNextTrophyToast(){
    const el = document.getElementById('trophyToast');
    if(!el) return;
    const msg = trophyToastQueue.shift();
    if(!msg){ trophyToastBusy=false; return; }
    trophyToastBusy = true;
    el.textContent = msg;
    el.classList.remove('hidden');
    requestAnimationFrame(()=> el.classList.add('show'));
    shake(4);
    setTimeout(()=>{
      el.classList.remove('show');
      setTimeout(()=>{
        el.classList.add('hidden');
        showNextTrophyToast();
      }, 500);
    }, 3200);
  }

  function checkTrophyType(key, currentValue){
    const def = TROPHIES[key];
    let idx = trophyProgress[key]||0;
    let advanced = false;
    while(idx < def.tiers.length && currentValue >= def.tiers[idx].req){
      def.tiers[idx].apply(player);
      queueTrophyToast(key, idx);
      idx++;
      advanced = true;
    }
    if(advanced){
      trophyProgress[key] = idx;
      updateTrophyUI();
    }
  }
  function checkTrophyProgress(){
    if(!player) return;
    checkTrophyType('survive', elapsed);
    checkTrophyType('kills', killCount);
    checkTrophyType('level', player.lvl);
    checkTrophyType('wardenKills', wardenKillCount);
    checkTrophyType('noHit', player.noDamageTimer||0);
    checkTrophyType('uniqueCount', player.uniqueTaken.size);
    checkTrophyType('combo', player.bestCombo||0);
    checkTrophyType('bonusPickups', player.bonusPickupsCollected||0);
    checkTrophyType('score', elapsed*10 + killCount*5 + player.lvl*50);
    checkTrophyType('highRarity', player.star3Count||0);
    checkTrophyType('doubleCrit', player.critChance);
    checkTrophyType('bigHit', player.maxHitDamage||0);
    checkTrophyType('magnetRange', player.magnet||0);
    checkTrophyType('explosive', player.explosive||0);
  }

    bar.innerHTML = Object.keys(TROPHIES).map(key=>{

      return `<div class="trophy-slot locked" data-key="${key}">

  function updateTrophyUI(){
    for(const key of Object.keys(TROPHIES)){
      const def = TROPHIES[key];
      const tierIdx = (trophyProgress[key]||0) - 1; // -1 = 未取得
      const slot = document.querySelector(`.trophy-slot[data-key="${key}"]`);
      if(!slot) continue;
      const unlocked = tierIdx >= 0;
      const maxed = unlocked && (tierIdx === def.tiers.length-1);
      slot.classList.toggle('locked', !unlocked);
      slot.classList.toggle('maxed', maxed);
      const starEl = slot.querySelector('.trophy-star');
      starEl.textContent = unlocked ? ('★'+(tierIdx+1)) : '';
      const titleEl = slot.querySelector('.tt-title');
      const descEl = slot.querySelector('.tt-desc');
      const nextEl = slot.querySelector('.tt-next');
      if(unlocked){
        const tier = def.tiers[tierIdx];
        titleEl.textContent = `${def.label} ★${tierIdx+1} ― ${tier.name}`;
        descEl.textContent = `効果: ${tier.bonusText}`;
      } else {
        titleEl.textContent = `${def.label}(未取得)`;
        descEl.textContent = `条件: ${def.tiers[0].name}`;
      }
      const nextTier = def.tiers[tierIdx+1];
      nextEl.textContent = nextTier ? `次の段階: ${nextTier.name}(${nextTier.bonusText})` : (unlocked ? '最大段階に到達' : '');
    }
  }

  function uniqueEffectText(key){
    if(key==='vitalityPact'){
      const missing = Math.max(0, effMaxHp() - player.hp);
      const lvl = player.vitalityLevel||1;
      const bonus = Math.min(missing*0.012 + (lvl-1)*0.03, VITALITY_BONUS_CAP);
      const mult = 1 + bonus;
      const capped = bonus >= VITALITY_BONUS_CAP - 1e-6;
      return `Lv.${lvl} ― 被ダメージ量 ${Math.round(missing)} 分 + Lv補正 により 攻撃力倍率 x${mult.toFixed(2)}${capped ? '(上限到達)' : ''}`;
    }
    if(key==='berserkPact'){
      const missingRatio = 1 - clamp(player.hp/effMaxHp(), 0, 1);
      const reductionScale = Math.min(0.5*(player.berserkLevel||1), 0.85);
      const cdMult = 1 - missingRatio*reductionScale;
      return `Lv.${player.berserkLevel||1} ― HP ${Math.round(missingRatio*100)}% 減少により 攻撃間隔倍率 x${cdMult.toFixed(2)}`;
    }
    if(key==='lastStandPact'){
      const lvl = player.lastStandLevel||1;
      const dmgB = Math.round(lastStandDmgBonus()*100);
      const critB = lastStandCritBonus().toFixed(2);
      const dropB = Math.round(lastStandDropMult()*100);
      return `Lv.${lvl} ― 常時発動中 ― ダメージ+${dmgB}% / 会心ダメージ+${critB} / ドロップ率x${(dropB/100).toFixed(1)}`;
    }
    if(key==='phoenixPact'){
      const lvl = player.phoenixLevel||1;
      const revivePct = Math.round((0.3+(lvl-1)*0.08)*100);
      const cd = player.phoenixCooldown||0;
      const regenB = phoenixRegenBonus().toFixed(1);
      const dropB = Math.round(phoenixHealDropBonus()*100);
      const passive = `常時 ― 減少HP比例回復+${regenB}/秒・ドロップ回復+${dropB}%`;
      if(cd>0){
        return `Lv.${lvl} ― クールタイム中 ― 残り${cd.toFixed(0)}秒(復活準備中) / ${passive}`;
      }
      return `Lv.${lvl} ― 準備完了 ― HPが0になると最大HPの${revivePct}%で復活 / ${passive}`;
    }
    if(key==='extraChoicePact'){
      return `常時発動 ― オーグメント選択画面の選択肢が3つ→4つに増加`;
    }
    if(key==='critAwakenPact'){
      const lvl = player.critAwakenLevel||1;
      return `Lv.${lvl} ― クリティカル率+25%/会心ダメージ+0.10が基礎、Lv毎に+10%/+0.05追加(現在の会心率 ${Math.round(player.critChance*100)}% ・ 会心倍率 x${player.critMult.toFixed(2)})`;
    }
    if(key==='brawnPact'){
      const lvl = player.brawnLevel||1;
      const dmgMult = player.brawnDmgMultApplied||1.4;
      const maxHpAdd = player.brawnMaxHpApplied||50;
      const regenAdd = player.brawnRegenApplied||1.5;
      const healAdd = player.brawnHealDropApplied||1.0;
      return `Lv.${lvl} ― 現在の変動: 攻撃力x${dmgMult.toFixed(2)} / 最大HP+${maxHpAdd} / HP回復+${regenAdd.toFixed(1)} / ドロップ回復+${Math.round(healAdd*100)}%(代償: クリティカル率-10% / 攻撃速度-10%)`;
    }
    if(key==='maxHpMultPact'){
      const lvl = player.vesselLevel||1;
      return `Lv.${lvl} ― 最大HP倍率 x${player.maxHpMult.toFixed(2)}(侵蝕の影響を受けない)/ 獲得する魂 x${player.vesselXpMult.toFixed(2)} ― 現在の実効最大HP: ${Math.round(effMaxHp())}`;
    }
    return '';
  }

  // ---------- enemy templates ----------
  function spawnEnemy(t){
    // spawn just outside camera view, around player
    const ang = rand(0, Math.PI*2);
    const R = Math.max(W,H)/2 + 60;
    const x = player.x + Math.cos(ang)*R;
    const y = player.y + Math.sin(ang)*R;

    const roll = Math.random();
    let type='wisp';
    if(t>240 && roll<0.10) type='brute';
    else if(t>90 && roll<0.30) type='hound';
    else type='wisp';

    // 硬い敵(brute/warden)はプレイヤーレベルに比例して追加でスケールする
    const hpLvlMult = 1 + (player.lvl-1)*0.20;
    const dmgLvlMult = 1 + (player.lvl-1)*0.10;

    let e;
    if(type==='brute'){
      e = {x,y,r:23, hp:(78+Math.min(t*0.75,270))*hpLvlMult, speed:62, dmg:26*dmgLvlMult, xp:9, color:'#7a1e34', glow:'#c81e3a', type};
    } else if(type==='hound'){
      e = {x,y,r:10, hp:10+Math.min(t*0.15,40), speed:150+Math.min(t*0.08,70), dmg:8, xp:3, color:'#5e5480', glow:'#a99bd8', type};
    } else {
      e = {x,y,r:14, hp:16+Math.min(t*0.25,60), speed:85+Math.min(t*0.05,40), dmg:10, xp:4, color:'#3a2f4a', glow:'#7fbf3f', type};
    }
    e.maxHp = e.hp;
    e.hitFlash=0;
    enemies.push(e);
  }

  // 【実験】6分から2分区切りで、番人・夜叉王の初期移動速度が段階的に1.5倍ずつ上昇していく
  function bossSpeedSteps(t){
    if(t < 360) return 0;
    return Math.floor((t-360)/120) + 1;
  }
  function bossSpeedStepMult(t){
    return 1 + bossSpeedSteps(t)*0.5;
  }
  function bossHpStepMult(t){
    return Math.pow(1.5, bossSpeedSteps(t));
  }

  // ---------- upgrades ----------
  // 汎用ステータス増減テーブル(☆1/☆2/☆3の基準値)。トレード系オーグメントから参照される
  const STAR_STAT_POOL = [
    {key:'dmg', label:'攻撃力', tiers:[3,6,10], adjust:(p,v,s)=>{ p.dmg = Math.max(1, p.dmg + s*v); }},
    {key:'speed', label:'移動速度', tiers:[0.08,0.15,0.24], adjust:(p,v,s)=>{ p.speed = Math.max(60, p.speed*(1+s*v)); }},
    {key:'atkCd', label:'攻撃間隔', tiers:[0.08,0.15,0.24], adjust:(p,v,s)=>{ p.atkCd = Math.max(0.15, p.atkCd*(1-s*v)); }},
    {key:'critChance', label:'クリティカル率', tiers:[0.04,0.06,0.09], adjust:(p,v,s)=>{ p.critChance = clamp(p.critChance+s*v,0,CRIT_CHANCE_CAP); }},
    {key:'critMult', label:'会心倍率', tiers:[0.08,0.15,0.25], adjust:(p,v,s)=>{ p.critMult = Math.max(1.0, p.critMult+s*v); }},
    {key:'magnet', label:'吸引範囲', tiers:[20,35,55], adjust:(p,v,s)=>{ p.magnet = Math.max(20, p.magnet+s*v); }},
    {key:'regen', label:'HP回復/秒', tiers:[0.3,0.55,0.9], adjust:(p,v,s)=>{ p.regen = Math.max(0, p.regen+s*v); }},
    {key:'maxHp', label:'最大HP', tiers:[8,15,25], adjust:(p,v,s)=>{
      const d = s*v;
      const oldMaxHp = p.maxHp;
      p.maxHp = Math.max(10, p.maxHp+d);
      if(s<0){
        // 減少方向: 最大HPが実際に減った分だけHPも減らすが、10より下には落とさない
        // (すでにHPが10未満なら、それ以上減らさないだけで無理に10まで回復もさせない)
        const actualChange = p.maxHp - oldMaxHp; // 0以下
        const floorHp = Math.min(p.hp, 10);
        p.hp = Math.max(floorHp, p.hp + actualChange);
        p.hp = Math.min(p.hp, effMaxHp());
      } else {
        p.hp = clamp(p.hp+d, 0, effMaxHp());
      }
    }},
  ];
  function pickStatEntries(n, excludeKeys){
    excludeKeys = excludeKeys || [];
    const copy = STAR_STAT_POOL.filter(e=> !excludeKeys.includes(e.key));
    const out=[];
    for(let i=0;i<n && copy.length;i++){
      const idx = Math.floor(Math.random()*copy.length);
      out.push(copy.splice(idx,1)[0]);
    }
    return out;
  }
  // トレード系オーグメントのプレビュー表示用。sign>0=上昇扱い、sign<0=下降扱いのラベルを作る
  // (攻撃間隔だけは「値が下がる=強い」ため表示の向きを反転させる)
  function formatStatChange(entry, amt, sign){
    const invert = entry.key === 'atkCd';
    const dispSign = invert ? -sign : sign;
    const sym = dispSign>0 ? '+' : '-';
    let valStr;
    if(entry.key==='speed' || entry.key==='atkCd' || entry.key==='critChance'){
      valStr = (Math.round(amt*1000)/10) + '%';
    } else if(entry.key==='critMult'){
      valStr = amt.toFixed(2) + 'x';
    } else {
      valStr = (Math.round(amt*10)/10).toString();
    }
    return `${entry.label} ${sym}${valStr}`;
  }

  const STAR_WEIGHTS = {1:55, 2:30, 3:15, 4:6};
  const UNIQUE_MIN_LEVEL = 5;
  const UNIQUE_BOOST_TIME = 480;  // 8分 ― 以降、未取得の固有オーグメントが出現しやすくなる
  const UNIQUE_BOOST_MULT = 3;    // 出現ウェイトを何倍にするか
  function pickUpgrades(n, minStar){
    minStar = minStar||1;
    const available = UPGRADE_POOL.filter(u=>{
      if(u.unique && player.uniqueTaken.has(u.name)) return false;
      if(u.star>=4 && player.lvl < UNIQUE_MIN_LEVEL) return false;
      if(u.star < minStar) return false;
      if(u.excludeBulletType && player.bulletType===u.excludeBulletType) return false;
      if(u.excludeIf && u.excludeIf(player)) return false;
      return true;
    });
    const pool = available.map(u=>{
      let w = STAR_WEIGHTS[u.star]||10;
      if(u.unique && elapsed >= UNIQUE_BOOST_TIME){
        w *= UNIQUE_BOOST_MULT;
      }
      if(u.boostForBulletType && player.bulletType===u.boostForBulletType){
        w *= (u.boostMult||1);
      }
      return {u, w};
    });
    const out=[];
    for(let i=0;i<n && pool.length;i++){
      const totalW = pool.reduce((s,e)=>s+e.w,0);
      let r = Math.random()*totalW;
      let idx = 0;
      for(;idx<pool.length;idx++){
        r -= pool[idx].w;
        if(r<=0) break;
      }
      idx = Math.min(idx, pool.length-1);
      out.push(pool[idx].u);
      pool.splice(idx,1);
    }
    return out.map(u=> u.resolve ? u.resolve() : u);
  }

  // ---------- combat ----------
  function fire(){
    if(player.bulletType==='orbit') return; // 旋回の盾は遠距離攻撃をしない
    // find nearest enemies up to projCount
    const targets = [...enemies]
      .filter(e=> dist2(e.x,e.y,player.x,player.y) <= player.range*player.range)
      .sort((a,b)=> dist2(a.x,a.y,player.x,player.y)-dist2(b.x,b.y,player.x,player.y))
      .slice(0, Math.max(3,player.projCount+2));
    if(targets.length===0) return;
    const dmg = getEffStats().dmg;
    if(player.bulletType==='pierce'){
      // 貫通の刃: 直進する高速な斬撃。実質無限貫通、視覚的にも細長い
      // このキャラは元々貫通が無限のため、「貫通」ステータスが死にステにならないよう
      // 基礎値(1)を超える貫通1につき斬撃ダメージ+15%に変換する
      const pierceBonusMult = 1 + Math.max(0, player.pierce-1)*0.15;
      for(let i=0;i<player.projCount;i++){
        const tgt = targets[i % targets.length];
        const ang = Math.atan2(tgt.y-player.y, tgt.x-player.x) + (i>=targets.length? rand(-0.25,0.25):0);
        bullets.push({
          x:player.x, y:player.y,
          vx:Math.cos(ang)*620, vy:Math.sin(ang)*620,
          dmg:dmg*pierceBonusMult, life:0.9, pierce:999, r:5, blade:true
        });
      }
      return;
    }
    for(let i=0;i<player.projCount;i++){
      const tgt = targets[i % targets.length];
      const ang = Math.atan2(tgt.y-player.y, tgt.x-player.x) + (i>=targets.length? rand(-0.25,0.25):0);
      bullets.push({
        x:player.x, y:player.y,
        vx:Math.cos(ang)*430, vy:Math.sin(ang)*430,
        dmg:dmg, life:1.1, pierce:player.pierce, r:5
      });
    }
  }

  const ORBITERS_PER_RING = 6;
  const ORBIT_BASE_RADIUS = 70;
  const ORBIT_RING_GAP = 40;
  function syncOrbiterCount(){
    if(!player.orbiters) return;
    const desired = 2 + Math.max(0, (player.projCount||1)-1);
    if(player.orbiters.length !== desired){
      const r = player.orbiters[0]?.r||14;
      const newOrbiters = [];
      const ringCount = Math.ceil(desired/ORBITERS_PER_RING);
      for(let ring=0; ring<ringCount; ring++){
        const startIdx = ring*ORBITERS_PER_RING;
        const countInRing = Math.min(ORBITERS_PER_RING, desired-startIdx);
        const radius = ORBIT_BASE_RADIUS + ring*ORBIT_RING_GAP;
        for(let i=0;i<countInRing;i++){
          newOrbiters.push({angle:(Math.PI*2/countInRing)*i, radius, r, hitCooldown:0});
        }
      }
      player.orbiters = newOrbiters;
    }
  }
  function updateOrbiters(dt){
    if(!player.orbiters) return;
    syncOrbiterCount();
    const eff = getEffStats();
    const baseAtkCd = 0.55;
    const rotSpeed = 3.4 * (baseAtkCd/eff.atkCd); // 攻撃速度が上がるほど回転も速くなる
    const baseMagnet = 70; // プレイヤー初期値を基準に、吸収範囲が伸びるほど盾も大きくなる
    const orbSize = clamp(14 * ((player.magnet||baseMagnet)/baseMagnet), 14, 42);
    for(const orb of player.orbiters){
      orb.angle += rotSpeed*dt;
      orb.r = orbSize;
      orb.x = player.x + Math.cos(orb.angle)*orb.radius;
      orb.y = player.y + Math.sin(orb.angle)*orb.radius;
      if(orb.hitCooldown>0) orb.hitCooldown -= dt;
    }
    for(const orb of player.orbiters){
      if(orb.hitCooldown>0) continue;
      let hitAny = false;
      for(const e of enemies){
        if(e.dead) continue;
        if(dist2(orb.x,orb.y,e.x,e.y) < (orb.r+e.r)*(orb.r+e.r)){
          hitAny = true;
          const effCC = getEffCritChance();
          const isCrit = Math.random() < Math.min(effCC, 1);
          let isDoubleCrit = false;
          if(isCrit && player.doubleCritUnlocked){
            const star = player.doubleCritStar||1;
            const threshold = 1 - 0.02*star;
            const overflowChance = Math.max(0, effCC - threshold);
            isDoubleCrit = Math.random() < overflowChance;
          }
          const critMult = getEffCritMult();
          const totalCritMult = critMult * (isDoubleCrit ? 2 : 1);
          let dmgDealt = isCrit ? eff.dmg*totalCritMult : eff.dmg;
          // このキャラは貫通が死にステになるため、貫通1につき対象の現在HP割合ダメージを追加
          const pierceHpPct = Math.min(0.01, Math.max(0, (player.pierce||1)-1) * 0.001);
          if(pierceHpPct>0){
            const hpDmgMult = e.type==='finalboss' ? 0.1 : 1; // ラスボスはHP割合ダメージが1/10
            dmgDealt += e.hp * pierceHpPct * hpDmgMult;
          }
          player.maxHitDamage = Math.max(player.maxHitDamage||0, dmgDealt);
          player.totalDamageDealt = (player.totalDamageDealt||0) + dmgDealt;
          e.hp -= dmgDealt;
          e.hitFlash = 0.12;
          const popupText = isDoubleCrit ? Math.round(dmgDealt)+'!!' : (isCrit? Math.round(dmgDealt)+'!' : Math.round(dmgDealt).toString());
          const popupColor = isDoubleCrit ? '#ff5fd1' : (isCrit ? '#ffe066' : '#f2e6c9');
          popup(e.x, e.y-e.r, popupText, popupColor, isCrit);
          if(isDoubleCrit){
            burst(e.x,e.y,'#ff5fd1',14);
            burst(e.x,e.y,'#ffe066',6);
            shake(5);
          } else if(isCrit){
            burst(e.x,e.y,'#ffe066',7); shake(2.5);
          }
          if(player.explosive>0 && isCrit){
            const explodeBase = eff.dmg * (player.explodeDmgRatio||0);
            explode(e.x, e.y, player.explodeRadius, explodeBase*totalCritMult*(1+(player.trophyExplodeDmgBonus||0)), e);
          }
          if(e.hp<=0){
            e.dead=true;
            handleEnemyDeath(e);
          }
        }
      }
      if(hitAny) orb.hitCooldown = eff.atkCd;
    }
  }

  function checkPlayerDeath(){
    if(player.hp > 0) return;
    if(player.phoenixPact && (player.phoenixCooldown||0) <= 0){
      const lvl = player.phoenixLevel||1;
      const revivePct = 0.3 + (lvl-1)*0.08;
      const cooldown = Math.max(40, 120 - (lvl-1)*20);
      player.hp = Math.round(effMaxHp()*revivePct);
      player.phoenixCooldown = cooldown;
      player.invuln = 1.5;
      burst(player.x, player.y, '#ffd166', 30);
      burst(player.x, player.y, '#ff2d55', 16);
      popup(player.x, player.y-40, '不死鳥の加護 発動!', '#ffd166', true);
      shake(14);
    } else {
      player.hp = 0;
      endGame();
    }
  }

  function hurtPlayer(v){
    if(player.invuln>0) return;
    player.hp -= v;
    player.invuln = 0.5;
    shake(6);
    player.noDamageTimer = 0;
    if(player.painBoostLevel>0){ player.painBoostTimer = 3; }
    checkPlayerDeath();
  }

  function milestoneBonus(p){
    p.maxHp += 7.5;
    p.hp = effMaxHp();
    p.dmg += 3;
  }

  function gainXp(v){
    if(player.trophyXpBonus){ v *= (1 + player.trophyXpBonus); }
    if(player.maxHpMultPact){ v *= player.vesselXpMult; }
    player.xp += v;
    while(player.xp >= player.xpNext){
      player.xp -= player.xpNext;
      player.lvl += 1;
      player.xpNext = Math.round(player.xpNext*1.28 + 4);
      player.critChance = Math.min(CRIT_CHANCE_CAP, player.critChance + 0.01);
      const isMilestone = player.lvl % 5 === 0;
      if(isMilestone){
        milestoneBonus(player);
        burst(player.x, player.y, '#e0a340', 22);
        shake(4);
      }
      openLevelUp(isMilestone ? 'milestone' : undefined);
    }
  }

  // ---------- rare bonus drops ----------
  const BONUS_DROP_CHANCE = 0.018;
  const BONUS_TYPES = ['magnet','buff','heal'];
  function currentBonusDropChance(){
    // レベルが上がるほど敵の湧き数が増えるため、討伐数あたりの確率を比例して下げて総量を抑える
    const levelFactor = 1 / (1 + (player.lvl-1)*0.05);
    const lastStandMult = isLastStand() ? lastStandDropMult() : 1;
    return BONUS_DROP_CHANCE * levelFactor * (player.bonusDropMult||1) * lastStandMult;
  }
  function maybeDropBonus(x,y,forced){
    if(forced || Math.random() < currentBonusDropChance()){
      const type = BONUS_TYPES[Math.floor(Math.random()*BONUS_TYPES.length)];
      bonusDrops.push({x,y,r:10,type,spin:0});
    }
  }

  function ownedUniquePacts(){
    const owned = [];
    if(player.vitalityPact) owned.push({levelKey:'vitalityLevel', name:'傷跡の力', icon:'⚚'});
    if(player.berserkPact) owned.push({levelKey:'berserkLevel', name:'断末魔の速度', icon:'⏳'});
    if(player.lastStandPact) owned.push({levelKey:'lastStandLevel', name:'背水の陣', icon:'⚡'});
    if(player.phoenixPact) owned.push({levelKey:'phoenixLevel', name:'不死鳥の加護', icon:'☥'});
    if(player.critAwakenPact) owned.push({levelKey:'critAwakenLevel', name:'会心の覚醒', icon:'❁', onLevelUp:p=>{
      p.critChance = Math.min(CRIT_CHANCE_CAP, p.critChance+0.10);
      p.critMult += 0.05;
    }});
    if(player.brawnPact) owned.push({levelKey:'brawnLevel', name:'剛力の化身', icon:'⛊', onLevelUp:p=>{
      p.dmg = Math.round(p.dmg*1.15);
      p.brawnDmgMultApplied = (p.brawnDmgMultApplied||1) * 1.15;
      p.maxHp += 20; p.hp += 20;
      p.brawnMaxHpApplied = (p.brawnMaxHpApplied||0) + 20;
      p.regen += 0.5;
      p.brawnRegenApplied = (p.brawnRegenApplied||0) + 0.5;
      p.healDropMult = (p.healDropMult||1) + 0.3;
      p.brawnHealDropApplied = (p.brawnHealDropApplied||0) + 0.3;
    }});
    if(player.maxHpMultPact) owned.push({levelKey:'vesselLevel', name:'永劫の器', icon:'♾', onLevelUp:p=>{
      p.maxHpMult += 0.3;
      p.vesselXpMult += 0.15;
    }});
    return owned;
  }
  function grantUniqueLevelUp(bossName){
    bossName = bossName || '巨獣';
    const owned = ownedUniquePacts();
    if(owned.length===0){
      player.maxHp += 15; player.hp = Math.min(effMaxHp(), player.hp+15);
      player.dmg += 6;
      showTelop(`${bossName}を討伐`, '固有オーグメント未所持のため、代わりに力の残滓(最大HP+15・攻撃力+6)を得た', 10);
      return;
    }
    const pick = owned[Math.floor(Math.random()*owned.length)];
    player[pick.levelKey] = (player[pick.levelKey]||1) + 1;
    if(pick.onLevelUp) pick.onLevelUp(player);
    showTelop(`${bossName}を討伐`, `「${pick.name}」が Lv.${player[pick.levelKey]} に上昇!`, 10);
  }
  function applyBonus(type){
    shake(3);
    player.bonusPickupsCollected = (player.bonusPickupsCollected||0) + 1;
    if(type==='magnet'){
      for(const o of orbs){ gainXp(o.v); burst(o.x,o.y,'#7fbf3f',5); }
      orbs = [];
      popup(player.x, player.y-30, '魂 全吸引', '#7fbf3f');
    } else if(type==='buff'){
      player.buffTime = 9;
      popup(player.x, player.y-30, '力が漲る', '#e0a340');
    } else if(type==='heal'){
      const healAmt = Math.round(10 * ((player.healDropMult||1) + phoenixHealDropBonus()) * getErosionHealFactor());
      player.hp = Math.min(effMaxHp(), player.hp+healAmt);
      popup(player.x, player.y-30, `HP +${healAmt}`, '#ef4a5f');
    }
  }
  function isLastStand(){
    return !!player.lastStandPact;
  }
  function lastStandDmgBonus(){
    return 0.20 + ((player.lastStandLevel||1)-1)*0.08;
  }
  function lastStandCritBonus(){
    return 0.4 + ((player.lastStandLevel||1)-1)*0.15;
  }
  function lastStandDropMult(){
    return 1.3 + ((player.lastStandLevel||1)-1)*0.15;
  }
  function phoenixRegenBonus(){
    if(!player.phoenixPact) return 0;
    const missingRatio = 1 - clamp(player.hp/effMaxHp(), 0, 1);
    const lvl = player.phoenixLevel||1;
    return missingRatio * 0.6 * lvl;
  }
  function phoenixHealDropBonus(){
    if(!player.phoenixPact) return 0;
    return 0.15 * (player.phoenixLevel||1);
  }
  function getEffCritMult(){
    return player.critMult + (isLastStand() ? lastStandCritBonus() : 0);
  }
  function guardianMitMult(){
    return player.bulletType==='orbit' ? 0.5 : 1; // 鋼鉄の守護者は侵食・ボスフィールド効果を半減
  }
  function erosionElapsed(){
    return elapsed - (player.erosionFrozenOffset||0);
  }
  function getErosionHealFactor(){
    if(!player.enragePhase4Alerted) return 1;
    const et4 = erosionElapsed() - ENRAGE_PHASE4_START;
    const normalFactor = Math.max(EROSION_HEAL_FLOOR, 1 - et4*EROSION_HEAL_DECAY_RATE);
    return 1 - (1-normalFactor)*guardianMitMult();
  }
  function getBossFreqMult(){
    let mult = 1;
    if(elapsed >= 300) mult *= 2;
    mult *= (player.bossFreqMult||1);
    return mult;
  }
  function isInMegabossSlowField(){
    for(const e of enemies){
      if(e.type!=='megaboss') continue;
      const d = Math.hypot(player.x-e.x, player.y-e.y);
      if(d < MEGABOSS_SLOW_RADIUS) return true;
    }
    return false;
  }
  function isInFinalBossField(){
    for(const e of enemies){
      if(e.type!=='finalboss') continue;
      const d = Math.hypot(player.x-e.x, player.y-e.y);
      if(d < FINAL_BOSS_FIELD_RADIUS) return true;
    }
    return false;
  }
  function getEffCritChance(){
    return isInFinalBossField() ? Math.max(0, player.critChance - FINAL_BOSS_FIELD_CRIT_REDUCTION*guardianMitMult()) : player.critChance;
  }
  function getEffStats(){
    const buffed = player.buffTime > 0;
    let dmgMult = buffed?1.5:1;
    let speedMult = buffed?1.3:1;
    let atkCdMult = buffed?0.65:1;
    if(player.trophyDmgBonus){
      dmgMult *= (1 + player.trophyDmgBonus);
    }
    if(player.trophySpeedBonus){
      speedMult *= (1 + player.trophySpeedBonus);
    }
    if(player.trophyAtkSpeedBonus){
      atkCdMult *= (1 - player.trophyAtkSpeedBonus);
    }
    if(player.vitalityPact){
      const missing = Math.max(0, effMaxHp() - player.hp);
      const lvl = player.vitalityLevel||1;
      const bonus = Math.min(missing*0.012 + (lvl-1)*0.03, VITALITY_BONUS_CAP);
      dmgMult *= (1 + bonus);
    }
    if(player.berserkPact){
      const missingRatio = 1 - clamp(player.hp/effMaxHp(), 0, 1);
      const reductionScale = Math.min(0.5 * (player.berserkLevel||1), 0.85);
      atkCdMult *= (1 - missingRatio*reductionScale);
    }
    if(isLastStand()){
      dmgMult *= (1 + lastStandDmgBonus());
    }
    if(player.painBoostTimer>0){
      const lvl = player.painBoostLevel||1;
      speedMult *= (1 + Math.min(0.10*lvl, 0.4));
      atkCdMult *= (1 - Math.min(0.07*lvl, 0.35));
    }
    let dmg = player.dmg * dmgMult;
    let speed = player.speed * speedMult;
    let atkCd = Math.max(0.08, player.atkCd * atkCdMult);
    if(isInMegabossSlowField()){
      const mult = guardianMitMult();
      speed = speed + (PLAYER_BASE_SPEED-speed)*mult;
      dmg *= (1 - 0.5*mult);
    }
    if(isInFinalBossField()){
      const mult = guardianMitMult();
      dmg *= (1 - FINAL_BOSS_FIELD_DEBUFF*mult);
      atkCd = atkCd / (1 - FINAL_BOSS_FIELD_DEBUFF*mult);
    }
    return {
      dmg: dmg,
      speed: speed,
      atkCd: Math.max(0.08, atkCd)
    };
  }

  function explode(x,y,radius,dmg,exclude){
    explosions.push({x,y,r:radius*0.15,maxR:radius,life:0.3,maxLife:0.3});
    burst(x,y,'#e0a340',12);
    for(const other of enemies){
      if(other.dead) continue;
      if(dist2(other.x,other.y,x,y) <= radius*radius){
        other.hp -= dmg;
        other.hitFlash = 0.12;
        player.maxHitDamage = Math.max(player.maxHitDamage||0, dmg);
        player.totalDamageDealt = (player.totalDamageDealt||0) + dmg;
        popup(other.x, other.y-other.r, Math.round(dmg).toString(), '#ff9d4d');
        if(other.hp<=0){
          other.dead = true;
          handleEnemyDeath(other);
        }
      }
    }
  }

  // ---------- main update ----------
  let lastT = 0;
  function update(dt){
    if(paused || !running) return;
    elapsed += dt;
    difficultyT += dt;
    checkTrophyProgress();

    // spawn logic
    lastSpawn += dt;
    const targetInterval = Math.max(0.18, spawnInterval - difficultyT*0.004);
    if(lastSpawn >= targetInterval){
      lastSpawn = 0;
      const batch = 1 + Math.floor(difficultyT/45);
      for(let i=0;i<batch;i++) spawnEnemy(difficultyT);
    }

    // 番人(少数湧きの硬い敵) スポーン判定 ― 常に最大1体のみ
    const bossFreqMult = getBossFreqMult();
    wardenTimer += dt;
    if(difficultyT >= WARDEN_MIN_TIME && wardenTimer >= Math.max(8, WARDEN_INTERVAL/bossFreqMult)){
      const wardenCount = enemies.reduce((n,e)=> n + (e.type==='warden'?1:0), 0);
      if(wardenCount === 0){
        wardenTimer = 0;
        spawnWarden(difficultyT);
      }
    }

    // 夜叉王(さらに強いボス) スポーン判定 ― 番人よりもさらに稀
    archfiendTimer += dt;
    if(difficultyT >= ARCHFIEND_MIN_TIME && archfiendTimer >= Math.max(8, ARCHFIEND_INTERVAL/bossFreqMult)){
      const archfiendCount = enemies.reduce((n,e)=> n + (e.type==='archfiend'?1:0), 0);
      if(archfiendCount === 0){
        archfiendTimer = 0;
        spawnArchfiend(difficultyT);
      }
    }

    // 深淵の巨獣(超巨大ボス) スポーン判定 ― 夜叉王よりもさらに稀
    megabossTimer += dt;
    if(elapsed >= MEGABOSS_MIN_TIME && megabossTimer >= Math.max(8, MEGABOSS_INTERVAL/bossFreqMult)){
      const megabossCount = enemies.reduce((n,e)=> n + (e.type==='megaboss'?1:0), 0);
      if(megabossCount === 0){
        megabossTimer = 0;
        spawnMegaboss(difficultyT);
      }
    }

    // 色違いの番人 スポーン判定 ― 5分以降、一定間隔ごとに低確率抽選
    rareWardenTimer += dt;
    if(elapsed >= RARE_WARDEN_MIN_TIME && rareWardenTimer >= Math.max(8, RARE_WARDEN_CHECK_INTERVAL/bossFreqMult)){
      rareWardenTimer = 0;
      const rareWardenCount = enemies.reduce((n,e)=> n + (e.type==='wardenRare'?1:0), 0);
      if(rareWardenCount === 0 && Math.random() < RARE_WARDEN_CHANCE){
        spawnRareWarden(difficultyT);
      }
    }

    // ラスボス ― 25分で1度だけ出現
    if(!finalBossSpawned && elapsed >= FINAL_BOSS_TIME){
      finalBossSpawned = true;
      spawnFinalBoss();
    }

    // 【実験】番人・夜叉王の初期移動速度上昇ステップの通知
    const curBossSpeedStep = bossSpeedSteps(elapsed);
    if(curBossSpeedStep > (player.bossSpeedStepShown||0)){
      player.bossSpeedStepShown = curBossSpeedStep;
      const mult = bossSpeedStepMult(elapsed);
      const hpMult = bossHpStepMult(elapsed);
      showTelop('ボスが強化された', `番人・色違い・夜叉王の初期移動速度×${mult.toFixed(1)} ・ 耐久×${hpMult.toFixed(2)}`, 6);
    }

    // player movement
    const eff = getEffStats();
    const mv = moveInput();
    player.x += mv.x*eff.speed*dt;
    player.y += mv.y*eff.speed*dt;
    player.x = clamp(player.x, 20, WORLD.w-20);
    player.y = clamp(player.y, 20, WORLD.h-20);
    if(mv.x!==0||mv.y!==0) player.facing = mv;
    if(player.invuln>0) player.invuln -= dt;
    {
      const totalRegen = player.regen + phoenixRegenBonus();
      if(totalRegen>0) player.hp = Math.min(effMaxHp(), player.hp + totalRegen*dt);
    }
    if(player.buffTime>0) player.buffTime = Math.max(0, player.buffTime-dt);
    if(player.painBoostTimer>0) player.painBoostTimer = Math.max(0, player.painBoostTimer-dt);
    if(player.erosionFreezeTimer>0){
      player.erosionFreezeTimer -= dt;
      player.erosionFrozenOffset = (player.erosionFrozenOffset||0) + dt;
    }
    if(player.phoenixCooldown>0) player.phoenixCooldown = Math.max(0, player.phoenixCooldown-dt);
    if(player.comboTimer>0){
      player.comboTimer -= dt;
      if(player.comboTimer<=0){ player.comboTimer=0; player.comboCount=0; }
    }
    player.noDamageTimer = (player.noDamageTimer||0) + dt;

    // 5分経過 ― 夜が牙を剥く(継続HP減少、時間経過で加速)
    if(!player.enrageActive && elapsed>=ENRAGE_START){
      player.enrageActive = true;
      triggerEnrageAlert();
    }
    // 7分経過 ― さらに加速し、固定量のHP減少も追加される
    if(!player.enragePhase2Alerted && elapsed>=ENRAGE_PHASE2_START){
      player.enragePhase2Alerted = true;
      triggerEnragePhase2Alert();
    }
    // 9分経過 ― 最大HPそのものが毎秒0.1ずつ削られていく
    if(!player.enragePhase3Alerted && elapsed>=ENRAGE_PHASE3_START){
      player.enragePhase3Alerted = true;
      triggerEnragePhase3Alert();
    }
    if(player.enragePhase3Alerted){
      player.maxHp = Math.max(20, player.maxHp - 1.0*dt*guardianMitMult());
      if(player.hp > effMaxHp()) player.hp = effMaxHp();
    }
    // 12分経過 ― ドロップHP回復割合が徐々に弱まっていく
    if(!player.enragePhase4Alerted && elapsed>=ENRAGE_PHASE4_START){
      player.enragePhase4Alerted = true;
      triggerEnragePhase4Alert();
    }
    {
      let drainPct = player.hpDrainPct||0;
      let drainFlat = 0;
      if(player.enrageActive){
        const et = erosionElapsed() - ENRAGE_START;
        drainPct += Math.min(0.01 + et*0.0002, 0.25) * guardianMitMult();
      }
      if(player.enragePhase2Alerted){
        const et2 = erosionElapsed() - ENRAGE_PHASE2_START;
        drainFlat = Math.min(1 + et2*0.045370, 50) * guardianMitMult();
      }
      if(drainPct>0 || drainFlat>0){
        player.erosionTickTimer = (player.erosionTickTimer||0) + dt;
        while(player.erosionTickTimer >= EROSION_TICK_INTERVAL){
          player.erosionTickTimer -= EROSION_TICK_INTERVAL;
          player.hp -= effMaxHp()*drainPct*EROSION_TICK_INTERVAL + drainFlat*EROSION_TICK_INTERVAL;
          checkPlayerDeath();
        }
      }
    }
    if(isInFinalBossField()){
      player.hp -= player.hp * FINAL_BOSS_FIELD_HP_DRAIN * guardianMitMult() * dt;
      checkPlayerDeath();
    }

    // camera follow
    cam.x += (player.x - cam.x)*Math.min(1, dt*6);
    cam.y += (player.y - cam.y)*Math.min(1, dt*6);

    // attack timer
    player.atkTimer -= dt;
    if(player.atkTimer<=0){
      player.atkTimer = eff.atkCd;
      fire();
    }

    // enemies
    for(const e of enemies){
      const dx = player.x-e.x, dy=player.y-e.y;
      const d = Math.hypot(dx,dy)||1;
      e.x += dx/d*e.speed*dt;
      e.y += dy/d*e.speed*dt;
      if(e.hitFlash>0) e.hitFlash -= dt;
      if(e.type==='archfiend' && !e.enraged && elapsed >= e.deadline){
        e.enraged = true;
        e.dmg *= 1.4;
        e.speed *= 1.25;
        e.color = '#3a0a12';
        e.glow = '#ff6b3d';
        popup(e.x, e.y-e.r-14, '夜叉王 激昂', '#ff6b3d', true);
      }
      if(e.type==='archfiend' && e.enraged){
        e.speed = Math.min(e.speed + 1.5*dt, ARCHFIEND_ENRAGE_MAX_SPEED);
      }
      if(d < e.r+player.r){
        hurtPlayer(e.dmg*dt*2.2);
      }
    }

    // bullets
    for(const b of bullets){
      b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    }
    bullets = bullets.filter(b=> b.life>0 && b.pierce>0);

    // 旋回の盾(機体固有の近接オービター)
    updateOrbiters(dt);

    // bullet-enemy collision
    for(const b of bullets){
      if(b.pierce<=0) continue;
      for(const e of enemies){
        if(e.dead) continue;
        if(dist2(b.x,b.y,e.x,e.y) < (b.r+e.r)*(b.r+e.r)){
          const effCC = getEffCritChance();
          const isCrit = Math.random() < Math.min(effCC, 1);
          let isDoubleCrit = false;
          if(isCrit && player.doubleCritUnlocked){
            const star = player.doubleCritStar||1;
            const threshold = 1 - 0.02*star; // 100% - ☆の値×2%
            const overflowChance = Math.max(0, effCC - threshold);
            isDoubleCrit = Math.random() < overflowChance;
          }
          const critMult = getEffCritMult();
          const totalCritMult = critMult * (isDoubleCrit ? 2 : 1);
          const dmgDealt = isCrit ? b.dmg*totalCritMult : b.dmg;
          player.maxHitDamage = Math.max(player.maxHitDamage||0, dmgDealt);
          player.totalDamageDealt = (player.totalDamageDealt||0) + dmgDealt;
          e.hp -= dmgDealt;
          e.hitFlash = 0.12;
          b.pierce -= 1;
          const popupText = isDoubleCrit ? Math.round(dmgDealt)+'!!' : (isCrit? Math.round(dmgDealt)+'!' : Math.round(dmgDealt).toString());
          const popupColor = isDoubleCrit ? '#ff5fd1' : (isCrit ? '#ffe066' : '#f2e6c9');
          popup(e.x, e.y-e.r, popupText, popupColor, isCrit);
          if(isDoubleCrit){
            burst(e.x,e.y,'#ff5fd1',14);
            burst(e.x,e.y,'#ffe066',6);
            shake(5);
          } else if(isCrit){
            burst(e.x,e.y,'#ffe066',7); shake(2.5);
          }
          if(player.explosive>0 && isCrit){
            const explodeBase = getEffStats().dmg * (player.explodeDmgRatio||0);
            explode(e.x, e.y, player.explodeRadius, explodeBase*totalCritMult*(1+(player.trophyExplodeDmgBonus||0)), e);
          }
          if(e.hp<=0){
            e.dead=true;
            handleEnemyDeath(e);
          }
          if(b.pierce<=0) break;
        }
      }
    }
    enemies = enemies.filter(e=> !e.dead);

    // orbs
    for(const o of orbs){
      const d = Math.hypot(player.x-o.x, player.y-o.y);
      if(d < player.magnet){
        const pull = clamp((player.magnet-d)/player.magnet, 0.15, 1) * 620 * (player.magnetSpeedMult||1);
        o.x += (player.x-o.x)/(d||1)*pull*dt;
        o.y += (player.y-o.y)/(d||1)*pull*dt;
      }
      if(d < player.r+6){
        o.collected = true;
        gainXp(o.v);
      }
    }
    orbs = orbs.filter(o=> !o.collected);

    // bonus drops (rare)
    for(const item of bonusDrops){
      const d = Math.hypot(player.x-item.x, player.y-item.y);
      const pullRange = player.magnet*1.1;
      if(d < pullRange){
        const pull = clamp((pullRange-d)/pullRange, 0.15, 1) * 520 * (player.magnetSpeedMult||1);
        item.x += (player.x-item.x)/(d||1)*pull*dt;
        item.y += (player.y-item.y)/(d||1)*pull*dt;
      }
      item.spin += dt*3;
      if(d < player.r+item.r){
        item.collected = true;
        applyBonus(item.type);
      }
    }
    bonusDrops = bonusDrops.filter(item=> !item.collected);

    // particles
    for(const p of particles){
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vx *= 0.9; p.vy *= 0.9;
      p.life -= dt;
    }
    particles = particles.filter(p=> p.life>0);
    for(const t of popups){ t.y -= 26*dt; t.life -= dt; }
    popups = popups.filter(t=> t.life>0);

    for(const ex of explosions){
      ex.life -= dt;
      ex.r += (ex.maxR-ex.r)*Math.min(1, dt*10);
    }
    explosions = explosions.filter(ex=> ex.life>0);



    updateHud();
  }

  // ---------- render ----------
  function drawBackground(){
    ctx.fillStyle = '#0a0910';
    ctx.fillRect(0,0,W,H);
    const ox = -cam.x + W/2, oy = -cam.y + H/2;
    const grid = 64;
    ctx.strokeStyle = 'rgba(169,155,216,0.045)';
    ctx.lineWidth = 1;
    const startX = ((ox % grid) + grid) % grid;
    const startY = ((oy % grid) + grid) % grid;
    ctx.beginPath();
    for(let x=startX; x<W; x+=grid){ ctx.moveTo(x,0); ctx.lineTo(x,H); }
    for(let y=startY; y<H; y+=grid){ ctx.moveTo(0,y); ctx.lineTo(W,y); }
    ctx.stroke();

    // world bounds vignette hint
    ctx.save();
    ctx.strokeStyle = 'rgba(200,30,58,0.25)';
    ctx.lineWidth = 3;
    ctx.strokeRect(ox, oy, WORLD.w, WORLD.h);
    ctx.restore();
  }

  function worldToScreen(x,y){ return {x: x-cam.x+W/2, y: y-cam.y+H/2}; }

  function draw(){
    ctx.save();
    if(shakeMag>0){
      ctx.translate(rand(-shakeMag,shakeMag), rand(-shakeMag,shakeMag));
    }
    drawBackground();

    if(!player){ ctx.restore(); return; }

    // orbs
    for(const o of orbs){
      const s = worldToScreen(o.x,o.y);
      ctx.beginPath();
      ctx.fillStyle = '#7fbf3f';
      ctx.shadowColor = '#7fbf3f'; ctx.shadowBlur = 8;
      ctx.arc(s.x,s.y,o.r,0,7);
      ctx.fill();
      ctx.shadowBlur=0;
    }

    // rare bonus drops
    for(const item of bonusDrops){
      const s = worldToScreen(item.x,item.y);
      const cfg = item.type==='magnet' ? {color:'#a99bd8', glyph:'◈'}
                 : item.type==='buff' ? {color:'#e0a340', glyph:'★'}
                 : {color:'#ef4a5f', glyph:'♥'};
      const pulse = 1 + Math.sin(elapsed*6 + item.x)*0.12;
      ctx.save();
      ctx.translate(s.x,s.y);
      ctx.rotate(item.spin);
      ctx.shadowColor = cfg.color; ctx.shadowBlur = 18;
      ctx.strokeStyle = cfg.color; ctx.lineWidth = 2;
      ctx.beginPath();
      const rr = item.r*1.8*pulse;
      ctx.moveTo(0,-rr); ctx.lineTo(rr,0); ctx.lineTo(0,rr); ctx.lineTo(-rr,0); ctx.closePath();
      ctx.stroke();
      ctx.restore();
      ctx.font = '13px serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = cfg.color;
      ctx.shadowColor = cfg.color; ctx.shadowBlur = 10;
      ctx.fillText(cfg.glyph, s.x, s.y+1);
      ctx.shadowBlur = 0;
    }

    // particles
    for(const p of particles){
      const s = worldToScreen(p.x,p.y);
      ctx.globalAlpha = clamp(p.life/0.5,0,1);
      ctx.fillStyle = p.color;
      ctx.fillRect(s.x-2,s.y-2,4,4);
      ctx.globalAlpha = 1;
    }

    // explosion rings
    for(const ex of explosions){
      const s = worldToScreen(ex.x,ex.y);
      const a = clamp(ex.life/ex.maxLife,0,1);
      ctx.save();
      ctx.globalAlpha = a*0.7;
      ctx.strokeStyle = '#e0a340';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#e0a340'; ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(s.x,s.y,ex.r,0,7);
      ctx.stroke();
      ctx.globalAlpha = a*0.15;
      ctx.fillStyle = '#e0a340';
      ctx.beginPath();
      ctx.arc(s.x,s.y,ex.r,0,7);
      ctx.fill();
      ctx.restore();
    }

    // enemies
    for(const e of enemies){
      const s = worldToScreen(e.x,e.y);
      if(s.x<-40||s.x>W+40||s.y<-40||s.y>H+40) continue;
      ctx.save();
      ctx.translate(s.x,s.y);
      ctx.fillStyle = e.hitFlash>0 ? '#fff' : e.color;
      ctx.shadowColor = e.glow; ctx.shadowBlur = 10;
      if(e.type==='hound'){
        ctx.beginPath();
        ctx.moveTo(0,-e.r); ctx.lineTo(e.r*0.8,e.r*0.7); ctx.lineTo(-e.r*0.8,e.r*0.7);
        ctx.closePath(); ctx.fill();
      } else if(e.type==='brute'){
        ctx.beginPath();
        ctx.roundRect? ctx.roundRect(-e.r,-e.r,e.r*2,e.r*2,4) : ctx.rect(-e.r,-e.r,e.r*2,e.r*2);
        ctx.fill();
      } else if(e.type==='warden' || e.type==='wardenRare'){
        ctx.shadowBlur = 20;
        ctx.beginPath();
        for(let i=0;i<8;i++){
          const a = (Math.PI/4)*i;
          const rr = i%2===0 ? e.r : e.r*0.72;
          const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
          i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
        }
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = e.glow; ctx.lineWidth=2;
        ctx.stroke();
        ctx.fillStyle = e.hitFlash>0 ? '#fff' : e.glow;
        ctx.beginPath(); ctx.arc(0,0,e.r*0.32,0,7); ctx.fill();
        if(e.type==='wardenRare'){
          const sparklePulse = 1 + Math.sin(elapsed*6)*0.15;
          ctx.strokeStyle = 'rgba(255,255,255,0.65)';
          ctx.lineWidth = 1.5;
          ctx.shadowBlur = 0;
          ctx.beginPath();
          ctx.arc(0,0,e.r*1.28*sparklePulse,0,7);
          ctx.stroke();
        }
      } else if(e.type==='megaboss'){
        ctx.shadowBlur = 34;
        // 減速フィールドの範囲(常時展開)
        ctx.save();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(201,166,255,0.06)';
        ctx.beginPath();
        ctx.arc(0,0,MEGABOSS_SLOW_RADIUS,0,7);
        ctx.fill();
        ctx.strokeStyle = 'rgba(201,166,255,0.25)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([6,8]);
        ctx.beginPath();
        ctx.arc(0,0,MEGABOSS_SLOW_RADIUS,0,7);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
        // 外側の脈動するオーラリング
        const ringPulse = 1 + Math.sin(elapsed*3)*0.06;
        ctx.strokeStyle = 'rgba(201,166,255,0.5)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0,0,e.r*1.15*ringPulse,0,7);
        ctx.stroke();
        // 本体(棘の多い巨大な塊)
        ctx.beginPath();
        const spikes = 16;
        for(let i=0;i<spikes;i++){
          const a = (Math.PI*2/spikes)*i;
          const rr = i%2===0 ? e.r : e.r*0.8;
          const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
          i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
        }
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#c9a6ff';
        ctx.lineWidth = 3;
        ctx.stroke();
        const corePulse = 1 + Math.sin(elapsed*5)*0.15;
        ctx.fillStyle = e.hitFlash>0 ? '#fff' : '#c9a6ff';
        ctx.beginPath(); ctx.arc(0,0,e.r*0.28*corePulse,0,7); ctx.fill();
      } else if(e.type==='finalboss'){
        ctx.shadowBlur = 44;
        // 深淵の虚像フィールド(常時展開・被ダメージ+弱体化ゾーン)
        ctx.save();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(239,74,95,0.05)';
        ctx.beginPath();
        ctx.arc(0,0,FINAL_BOSS_FIELD_RADIUS,0,7);
        ctx.fill();
        const fieldPulse = 1 + Math.sin(elapsed*2)*0.02;
        ctx.strokeStyle = 'rgba(239,74,95,0.3)';
        ctx.lineWidth = 2;
        ctx.setLineDash([5,7]);
        ctx.beginPath();
        ctx.arc(0,0,FINAL_BOSS_FIELD_RADIUS*fieldPulse,0,7);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
        // 二重の脈動するオーラリング
        const ringPulse1 = 1 + Math.sin(elapsed*2.2)*0.05;
        const ringPulse2 = 1 + Math.cos(elapsed*3.1)*0.07;
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0,0,e.r*1.35*ringPulse1,0,7); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,215,120,0.55)';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(0,0,e.r*1.15*ringPulse2,0,7); ctx.stroke();
        // 本体(無数の棘を持つ漆黒の塊)
        ctx.beginPath();
        const spikes = 20;
        for(let i=0;i<spikes;i++){
          const a = (Math.PI*2/spikes)*i;
          const rr = i%2===0 ? e.r : e.r*0.78;
          const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
          i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
        }
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#fff3c4';
        ctx.lineWidth = 3;
        ctx.stroke();
        const corePulseF = 1 + Math.sin(elapsed*6)*0.18;
        ctx.fillStyle = e.hitFlash>0 ? '#fff' : '#fff3c4';
        ctx.shadowColor = '#fff3c4'; ctx.shadowBlur = 26;
        ctx.beginPath(); ctx.arc(0,0,e.r*0.26*corePulseF,0,7); ctx.fill();
      } else if(e.type==='archfiend'){
        ctx.shadowBlur = 26;
        ctx.beginPath();
        const spikes = 12;
        for(let i=0;i<spikes;i++){
          const a = (Math.PI*2/spikes)*i;
          const rr = i%2===0 ? e.r : e.r*0.62;
          const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
          i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
        }
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = e.enraged ? '#ff6b3d' : '#ff2d55';
        ctx.lineWidth = 3;
        ctx.stroke();
        const corePulse = 1 + Math.sin(elapsed*8)*0.12;
        ctx.fillStyle = e.hitFlash>0 ? '#fff' : (e.enraged ? '#ff6b3d' : '#ff2d55');
        ctx.beginPath(); ctx.arc(0,0,e.r*0.3*corePulse,0,7); ctx.fill();
        // 確定報酬の残り時間リング(討伐猶予)
        if(!e.enraged){
          const remain = clamp((e.deadline-elapsed)/ARCHFIEND_KILL_WINDOW,0,1);
          ctx.strokeStyle = '#ffe066';
          ctx.lineWidth = 4;
          ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.arc(0,0,e.r+22,-Math.PI/2,-Math.PI/2+remain*Math.PI*2);
          ctx.stroke();
        }
      } else {
        ctx.beginPath(); ctx.arc(0,0,e.r,0,7); ctx.fill();
      }
      ctx.shadowBlur=0;
      ctx.restore();
    }

    // bullets
    for(const b of bullets){
      const s = worldToScreen(b.x,b.y);
      if(b.blade){
        const ang = Math.atan2(b.vy,b.vx);
        ctx.save();
        ctx.translate(s.x,s.y);
        ctx.rotate(ang);
        ctx.fillStyle = '#ff4d6d';
        ctx.shadowColor = '#ff4d6d'; ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.moveTo(16,0); ctx.lineTo(-10,-3.5); ctx.lineTo(-10,3.5);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        ctx.shadowBlur = 0;
        continue;
      }
      ctx.beginPath();
      ctx.fillStyle = '#e0a340';
      ctx.shadowColor = '#e0a340'; ctx.shadowBlur = 10;
      ctx.arc(s.x,s.y,b.r,0,7);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // 旋回の盾
    if(player.orbiters){
      for(const orb of player.orbiters){
        const s = worldToScreen(orb.x,orb.y);
        ctx.save();
        ctx.translate(s.x,s.y);
        ctx.rotate(orb.angle);
        ctx.fillStyle = '#4fc3ff';
        ctx.shadowColor = '#4fc3ff'; ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.moveTo(orb.r,0); ctx.lineTo(-orb.r*0.5,-orb.r*0.6); ctx.lineTo(-orb.r*0.5,orb.r*0.6);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();
        ctx.shadowBlur = 0;
      }
    }

    // 魂の吸収範囲(目視用の薄い円)
    {
      const s = worldToScreen(player.x,player.y);
      ctx.save();
      ctx.strokeStyle = 'rgba(127,191,63,0.28)';
      ctx.lineWidth = 1;
      ctx.setLineDash([5,6]);
      ctx.beginPath();
      ctx.arc(s.x,s.y,player.magnet,0,7);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    // player
    {
      const s = worldToScreen(player.x,player.y);
      ctx.save();
      ctx.translate(s.x,s.y);
      if(player.buffTime>0){
        const pulse = 1 + Math.sin(elapsed*10)*0.08;
        ctx.save();
        ctx.globalAlpha = clamp(player.buffTime/1.2,0.35,0.75);
        ctx.strokeStyle = '#e0a340';
        ctx.lineWidth = 2;
        ctx.shadowColor = '#e0a340'; ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.arc(0,0,(player.r+7)*pulse,0,7);
        ctx.stroke();
        ctx.restore();
      }
      if(player.phoenixPact && (player.phoenixCooldown||0)<=0){
        const pPulse = 1 + Math.sin(elapsed*3.5)*0.12;
        ctx.save();
        ctx.globalAlpha = 0.55 + Math.sin(elapsed*3.5)*0.15;
        ctx.strokeStyle = '#ffd166';
        ctx.lineWidth = 2.5;
        ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.arc(0,0,(player.r+13)*pPulse,0,7);
        ctx.stroke();
        // 小さな羽ばたく火の粒子風のきらめき
        for(let i=0;i<3;i++){
          const a = elapsed*1.5 + i*(Math.PI*2/3);
          const px = Math.cos(a)*(player.r+13)*pPulse;
          const py = Math.sin(a)*(player.r+13)*pPulse;
          ctx.fillStyle = '#ffe9a8';
          ctx.beginPath();
          ctx.arc(px,py,1.8,0,7);
          ctx.fill();
        }
        ctx.restore();
      }
      const flick = player.invuln>0 ? (Math.floor(elapsed*30)%2===0) : true;
      if(flick){
        const charColor = player.charColor || '#c81e3a';
        ctx.shadowColor = '#a99bd8'; ctx.shadowBlur = 16;
        ctx.fillStyle = '#e8e2d4';
        ctx.beginPath(); ctx.arc(0,0,player.r,0,7); ctx.fill();
        ctx.shadowBlur=0;
        ctx.strokeStyle = charColor; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(0,0,player.r,0,7); ctx.stroke();
        // facing indicator
        ctx.fillStyle=charColor;
        ctx.beginPath();
        ctx.arc(player.facing.x*player.r*0.6, player.facing.y*player.r*0.6, 3, 0, 7);
        ctx.fill();
      }
      ctx.restore();
    }

    // damage popups
    ctx.textAlign='center';
    for(const t of popups){
      const s = worldToScreen(t.x,t.y);
      const alpha = clamp(t.life/t.maxLife,0,1);
      if(t.big){
        const progress = clamp((t.maxLife - t.life)/t.maxLife, 0, 1);
        const scale = 1.7 - 0.7*Math.min(progress*3.2,1);
        ctx.save();
        ctx.translate(s.x,s.y);
        ctx.scale(scale,scale);
        ctx.font = 'bold 21px "Courier New", monospace';
        ctx.globalAlpha = alpha;
        ctx.shadowColor = t.color; ctx.shadowBlur = 20;
        ctx.strokeStyle = 'rgba(10,9,16,0.75)'; ctx.lineWidth = 4;
        ctx.strokeText(t.text, 0, 0);
        ctx.fillStyle = t.color;
        ctx.fillText(t.text, 0, 0);
        ctx.restore();
      } else {
        ctx.font = '12px "Courier New", monospace';
        ctx.globalAlpha = alpha;
        ctx.fillStyle = t.color;
        ctx.fillText(t.text, s.x, s.y);
      }
      ctx.globalAlpha = 1;
    }

    // ボス系のHPバーを最前面レイヤーとして描画(爆風やダメージ数値に隠れないように)
    drawBossHpBars();

    // 画面外のボスの方向インジケーター
    drawOffscreenBossIndicators();

    ctx.restore();
  }

  const BOSS_HP_BAR_TYPES = {brute:1, warden:1, wardenRare:1, archfiend:1, megaboss:1, finalboss:1};
  function drawBossHpBars(){
    for(const e of enemies){
      if(!BOSS_HP_BAR_TYPES[e.type]) continue;
      const s = worldToScreen(e.x, e.y);
      if(s.x < -e.r-20 || s.x > W+e.r+20 || s.y < -e.r-20 || s.y > H+e.r+20) continue;
      const barW = e.r*2, barH = 7, barY = s.y - e.r - 12;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(s.x-e.r-1, barY-1, barW+2, barH+2);
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(s.x-e.r, barY, barW, barH);
      ctx.fillStyle = '#c81e3a';
      ctx.fillRect(s.x-e.r, barY, barW*(e.hp/e.maxHp), barH);
    }
  }

  function drawOffscreenBossIndicators(){
    const bossTypes = {warden:1, wardenRare:1, archfiend:1, megaboss:1, finalboss:1};
    const ringRadius = 68; // プレイヤーのすぐ近くに固定(画面端ではない)
    const pScreen = worldToScreen(player.x, player.y);
    for(const e of enemies){
      if(!bossTypes[e.type]) continue;
      const s = worldToScreen(e.x, e.y);
      const onScreen = s.x > -e.r && s.x < W+e.r && s.y > -e.r && s.y < H+e.r;
      if(onScreen) continue;
      const dx = e.x - player.x, dy = e.y - player.y;
      const angle = Math.atan2(dy,dx);
      const ex = pScreen.x + Math.cos(angle)*ringRadius;
      const ey = pScreen.y + Math.sin(angle)*ringRadius;
      ctx.save();
      ctx.translate(ex,ey);
      ctx.rotate(angle);
      ctx.shadowColor = e.glow; ctx.shadowBlur = 12;
      ctx.fillStyle = e.glow;
      ctx.beginPath();
      ctx.moveTo(12,0); ctx.lineTo(-7,-8); ctx.lineTo(-7,8);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }
  }

  let lastTickMaxHp = null;
  function rebuildHpTicks(){
    const maxHp = Math.round(effMaxHp());
    if(maxHp === lastTickMaxHp) return;
    lastTickMaxHp = maxHp;
    const container = document.getElementById('hpTicks');
    container.innerHTML = '';
    for(let v=5; v<maxHp; v+=5){
      const pct = (v/maxHp)*100;
      const tick = document.createElement('div');
      tick.className = 'tick';
      tick.style.left = pct+'%';
      container.appendChild(tick);
    }
  }

  function updateHud(){
    document.getElementById('hpFill').style.width = clamp(player.hp/effMaxHp()*100,0,100)+'%';
    document.getElementById('xpFill').style.width = clamp(player.xp/player.xpNext*100,0,100)+'%';
    rebuildHpTicks();
    const hpRatio = clamp(player.hp/effMaxHp(), 0, 1);
    const vignette = document.getElementById('dangerVignette');
    if(hpRatio < 0.3){
      const intensity = (0.3 - hpRatio) / 0.3; // 0(30%)→1(0%)
      vignette.style.opacity = (0.15 + intensity*0.8).toFixed(2);
      vignette.classList.toggle('pulse', hpRatio < 0.15);
    } else {
      vignette.style.opacity = 0;
      vignette.classList.remove('pulse');
    }
    const mm = String(Math.floor(elapsed/60)).padStart(2,'0');
    const ss = String(Math.floor(elapsed%60)).padStart(2,'0');
    document.getElementById('clock').textContent = mm+':'+ss;
    document.querySelectorAll('#lvl')[0].textContent = 'LV ' + player.lvl;
    const bt = document.getElementById('buffTimer');
    if(player.buffTime>0){
      bt.classList.remove('hidden');
      bt.textContent = '強化 ' + player.buffTime.toFixed(1) + 's';
    } else {
      bt.classList.add('hidden');
    }
    document.getElementById('hpFill').parentElement.classList.toggle('enraged', !!player.enrageActive);
    updateStatusPanel();
    updateUniqueBar();
  }

  function showTelop(line1, line2, shakeAmt){
    const el = document.getElementById('enrageAlert');
    el.querySelector('.ea-line1').textContent = line1;
    el.querySelector('.ea-line2').textContent = line2;
    el.classList.remove('hidden');
    requestAnimationFrame(()=> el.classList.add('show'));
    shake(shakeAmt||6);
    setTimeout(()=>{
      el.classList.remove('show');
      setTimeout(()=> el.classList.add('hidden'), 700);
    }, 4200);
  }
