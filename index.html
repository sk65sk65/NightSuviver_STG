  function fmtWithDelta(effVal, baseVal, decimals, suffix){
    suffix = suffix || '';
    const shownEff = decimals>0 ? effVal.toFixed(decimals) : Math.round(effVal);
    const diff = effVal - baseVal;
    if(Math.abs(diff) < (decimals>0 ? 0.005 : 0.5)) return `${shownEff}${suffix}`;
    const sign = diff>0 ? '+' : '';
    const shownDiff = decimals>0 ? diff.toFixed(decimals) : Math.round(diff);
    return `${shownEff}${suffix} (${sign}${shownDiff}${suffix})`;
  }

  function updateStatusPanel(){
    const eff = getEffStats();
    const effCritMult = getEffCritMult();
    const totalDrainFlat = player.enragePhase2Alerted ? Math.min(1+(erosionElapsed()-ENRAGE_PHASE2_START)*0.045370, 50) : 0;
    const netRegen = player.regen - totalDrainFlat;
    const regenDisplay = totalDrainFlat>0 ? `${netRegen.toFixed(1)} (-${totalDrainFlat.toFixed(1)})` : player.regen.toFixed(1);
    const rows = [
      ['HP', Math.ceil(player.hp)+' / '+Math.ceil(effMaxHp())],
      ['攻撃力', fmtWithDelta(eff.dmg, player.dmg, 0)],
      ['攻撃間隔', fmtWithDelta(eff.atkCd, player.atkCd, 2, 's')],
      ['移動速度', fmtWithDelta(eff.speed, player.speed, 0)],
    ];
    if(player.doubleCritUnlocked){
      const star = player.doubleCritStar||1;
      const threshold = 1 - 0.02*star;
      const overflow = Math.max(0, player.critChance-threshold);
      rows.push(['ダブル会心', Math.round(overflow*100)+'% (☆'+star+')', '#ff5fd1']);
    }
    rows.push(
      ['クリティカル', Math.round(player.critChance*100)+'%'],
      ['会心倍率', effCritMult.toFixed(2)+'x'],
      ['弾数', player.projCount],
      [player.bulletType==='pierce' ? '貫通(斬撃威力に変換)' : (player.bulletType==='orbit' ? '貫通(HP%ダメージに変換)' : '貫通'),
       player.bulletType==='pierce' ? ('+'+Math.round(Math.max(0,player.pierce-1)*15)+'%') :
       (player.bulletType==='orbit' ? ('+'+Math.min(1, Math.max(0,(player.pierce||1)-1)*0.1).toFixed(1)+'%HP') : player.pierce)],
      ['HP回復/秒', regenDisplay],
      ['爆風Lv', player.explosive],
      ['ドロップ率', 'x'+player.bonusDropMult.toFixed(2)],
      ['回復量倍率', 'x'+player.healDropMult.toFixed(2)]
    );
    if((player.bossFreqMult||1) > 1){
      rows.push(['ボス出現頻度', 'x'+player.bossFreqMult.toFixed(2)]);
    }
    if((player.magnetSpeedMult||1) > 1){
      rows.push(['アイテム吸収速度', 'x'+player.magnetSpeedMult.toFixed(2)]);
    }
    const totalDrainPct = (player.hpDrainPct||0) + (player.enrageActive ? Math.min(0.01+(erosionElapsed()-ENRAGE_START)*0.0002,0.25) : 0);
    if(totalDrainPct>0){
      rows.push(['HP割合侵蝕', '-'+(totalDrainPct*100).toFixed(1)+'%', '#ef4a5f']);
    }
    if(totalDrainFlat>0){
      rows.push(['固定HP侵蝕', '-'+totalDrainFlat.toFixed(1), '#ef4a5f']);
    }
    if(player.enragePhase3Alerted){
      rows.push(['最大HP侵蝕', '-1.0', '#ef4a5f']);
    }
    if(player.enragePhase4Alerted){
      rows.push(['回復効果侵食', '-'+Math.round((1-getErosionHealFactor())*100)+'%', '#ef4a5f']);
    }
    if(player.erosionFreezeTimer>0){
      rows.push(['侵蝕上昇停止', player.erosionFreezeTimer.toFixed(1)+'s', '#ef4a5f']);
    }
    if(player.phoenixPact){
      rows.push(['不死鳥 Lv'+(player.phoenixLevel||1), player.phoenixCooldown>0 ? `CT ${player.phoenixCooldown.toFixed(0)}s` : '準備完了']);
      rows.push(['不死鳥回復', '+'+phoenixRegenBonus().toFixed(1)+'/秒']);
    }
    if(player.painBoostLevel>0 && player.painBoostTimer>0){
      rows.push(['血の高揚', player.painBoostTimer.toFixed(1)+'s']);
    }
    if(isInMegabossSlowField()){
      const gm = guardianMitMult();
      rows.push(['減速フィールド', gm<1 ? '速度半減/攻撃力-25%(軽減中)' : '速度固定/攻撃力-50%']);
    }
    if(isInFinalBossField()){
      const gm = guardianMitMult();
      rows.push(['深淵の虚像', gm<1
        ? `-${(FINAL_BOSS_FIELD_HP_DRAIN*gm*100).toFixed(0)}%HP/秒・攻撃力/速度-${(FINAL_BOSS_FIELD_DEBUFF*gm*100).toFixed(0)}%・会心率-${(FINAL_BOSS_FIELD_CRIT_REDUCTION*gm*100).toFixed(0)}%(軽減中)`
        : '-10%HP/秒・攻撃力/速度-30%・会心率-100%', '#ef4a5f']);
    }
    const grid = document.getElementById('statusGrid');
    grid.innerHTML = rows.map(([k,v,c])=> c
      ? `<span style="color:${c}">${k}</span><span style="color:${c}">${v}</span>`
      : `<span>${k}</span><span>${v}</span>`
    ).join('');
  }

  // ---------- level up flow ----------
  const MAX_REROLLS = 2;
  let rerollsLeft = MAX_REROLLS;

  function starGlyphs(n){
    return '★'.repeat(n) + '☆'.repeat(Math.max(0,4-n));
  }
  function renderChoices(el, choicesEl, minStar){
    choicesEl.innerHTML='';
    const choiceCount = player.extraChoicePact ? 4 : 3;
    const opts = pickUpgrades(choiceCount, minStar);
    for(const o of opts){
      const div = document.createElement('div');
      div.className = `choice rarity-${o.star}`;
      div.innerHTML = `<span class="choice-icon">${o.icon}</span>
        <div class="choice-stars">${starGlyphs(o.star)}</div>
        <div class="choice-name">${o.name}</div>
        <div class="choice-desc">${o.desc}</div>
        ${o.unique ? '<div class="choice-unique">固有・一度のみ</div>' : ''}`;
      div.addEventListener('click', ()=>{
        o.apply(player);
        if(o.unique) player.uniqueTaken.add(o.name);
        if(o.star===3) player.star3Count = (player.star3Count||0)+1;
        el.classList.add('hidden');
        paused=false;
      });
      choicesEl.appendChild(div);
    }
  }

  function renderUniqueChoiceReward(el, choicesEl){
    choicesEl.innerHTML='';
    const owned = ownedUniquePacts();
    for(const u of owned){
      const curLvl = player[u.levelKey]||1;
      const div = document.createElement('div');
      div.className = 'choice rarity-4';
      div.innerHTML = `<span class="choice-icon">${u.icon}</span>
        <div class="choice-stars">★★★★</div>
        <div class="choice-name">${u.name}</div>
        <div class="choice-desc">Lv.${curLvl} → Lv.${curLvl+1} に強化</div>`;
      div.addEventListener('click', ()=>{
        player[u.levelKey] = curLvl+1;
        if(u.onLevelUp) u.onLevelUp(player);
        popup(player.x, player.y-40, `${u.name} Lv.${curLvl+1}!`, '#c9a6ff', true);
        el.classList.add('hidden');
        paused=false;
      });
      choicesEl.appendChild(div);
    }
  }

  function openLevelUp(kind){
    paused = true;
    const el = document.getElementById('levelUp');
    const titleEl = document.getElementById('luTitle');
    const noteEl = document.getElementById('luNote');
    const choicesEl = document.getElementById('luChoices');
    const rerollBtn = document.getElementById('rerollBtn');

    el.classList.toggle('milestone', kind==='milestone');
    el.classList.toggle('bonus', kind==='bonus');
    el.classList.toggle('archfiend', kind==='archfiend' || kind==='archfiendUnique');
    const minStar = kind==='archfiend' ? 3 : undefined;

    if(kind==='archfiendUnique'){
      titleEl.textContent = '討伐報酬 ― 力を選び強化せよ';
      noteEl.textContent = '所持する固有オーグメントを1つ選んでレベルアップ';
      noteEl.classList.remove('hidden');
      rerollBtn.classList.add('hidden');
      renderUniqueChoiceReward(el, choicesEl);
      el.classList.remove('hidden');
      return;
    }
    rerollBtn.classList.remove('hidden');

    if(kind==='milestone'){
      titleEl.textContent = `第${player.lvl}夜 ― 血の恩恵`;
      noteEl.textContent = '最大HP +7.5 ・ 攻撃力 +3 ・ 全回復';
      noteEl.classList.remove('hidden');
    } else if(kind==='bonus'){
      titleEl.textContent = '番人を討伐 ― 追加の力';
      noteEl.textContent = '討伐報酬としてもう1つ選べる';
      noteEl.classList.remove('hidden');
    } else if(kind==='archfiend'){
      titleEl.textContent = '討伐報酬 ― 禁忌の力';
      noteEl.textContent = '確定で☆3以上のオーグメントを獲得';
      noteEl.classList.remove('hidden');
    } else {
      titleEl.textContent = '魂が満ちる ― 選べ';
      noteEl.textContent = '';
      noteEl.classList.add('hidden');
    }

    rerollsLeft = MAX_REROLLS;
    rerollBtn.textContent = `選び直す (残り${rerollsLeft})`;
    rerollBtn.disabled = false;
    rerollBtn.onclick = ()=>{
      if(rerollsLeft<=0) return;
      rerollsLeft -= 1;
      renderChoices(el, choicesEl, minStar);
      rerollBtn.textContent = rerollsLeft>0 ? `選び直す (残り${rerollsLeft})` : '選び直す (残り0)';
      rerollBtn.disabled = rerollsLeft<=0;
    };

    renderChoices(el, choicesEl, minStar);
    el.classList.remove('hidden');
  }

  // ---------- game over ----------
  function endGame(){
    showResultScreen(false);
  }
  function triggerGameClear(){
    showResultScreen(true);
  }
  function showResultScreen(isClear){
    running = false;
    const mm = String(Math.floor(elapsed/60)).padStart(2,'0');
    const ss = String(Math.floor(elapsed%60)).padStart(2,'0');

    const survivalScore = Math.round(elapsed*10);
    const killScore = killCount*5;
    const levelScore = player.lvl*50;
    const clearBonus = isClear ? 100000 : 0;
    let trophyScore = 0;
    const trophySlots = [];
    for(const key of Object.keys(TROPHIES)){
      const tierCount = trophyProgress[key]||0;
      if(tierCount>0){
        const def = TROPHIES[key];
        const tier = def.tiers[tierCount-1];
        let sumForType = 0;
        for(let i=0;i<tierCount;i++){ sumForType += (TROPHY_SCORE_PER_TIER[i]||600); }
        trophyScore += sumForType;
        trophySlots.push(`<div class="trophy-slot" data-result-key="${key}">
          <div class="trophy-icon">${def.icon}</div>
          <div class="trophy-star">★${tierCount}</div>
          <div class="trophy-tip">
            <div class="tt-title">${def.label} ★${tierCount} ― ${tier.name}</div>
            <div class="tt-desc">効果: ${tier.bonusText}</div>
            <div class="tt-next">スコア +${sumForType}</div>
          </div>
        </div>`);
      }
    }
    const totalScore = survivalScore + killScore + levelScore + trophyScore + clearBonus;

    const titleEl = document.getElementById('overTitle');
    titleEl.classList.toggle('clear', isClear);
    titleEl.textContent = isClear ? '宴は終わった' : '夜が明けた';

    document.getElementById('resultScore').textContent = totalScore.toLocaleString();
    document.getElementById('resultTime').textContent = mm+':'+ss;
    const charName = (CHARACTERS[selectedCharacter]||CHARACTERS[0]).name;
    document.getElementById('resultLine').textContent = isClear
      ? `ゲームクリア ― ${charName} ― 到達レベル ${player.lvl} ／ 討伐 ${killCount}`
      : `${charName} ― 到達レベル ${player.lvl} ／ 討伐 ${killCount}`;

    const totalBossKills = wardenKillCount + rareWardenKillCount + archfiendKillCount + megabossKillCount;
    document.getElementById('resultStats').innerHTML =
      `討伐ボス数: ${totalBossKills}(番人${wardenKillCount}・色違い${rareWardenKillCount}・夜叉王${archfiendKillCount}・巨獣${megabossKillCount})<br>` +
      `与えた総ダメージ: ${Math.round(player.totalDamageDealt||0).toLocaleString()}` +
      (isClear ? `<br>クリアボーナス: +${clearBonus.toLocaleString()}` : '');

    const trophyEl = document.getElementById('resultTrophies');
    if(trophySlots.length){
      trophyEl.innerHTML = '<div class="rt-title">獲得トロフィー(タップ/ホバーで詳細)</div><div class="result-trophy-row">' + trophySlots.join('') + '</div>';
      trophyEl.classList.remove('hidden');
    } else {
      trophyEl.innerHTML = '';
      trophyEl.classList.add('hidden');
    }

    document.getElementById('overScreen').classList.remove('hidden');
  }

  // ---------- loop ----------
  function loop(t){
    if(!lastT) lastT=t;
    let dt = (t-lastT)/1000;
    lastT = t;
    dt = Math.min(dt, 0.05);
    update(dt);
    if(shakeMag>0) shakeMag = Math.max(0, shakeMag - dt*40);
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- boot ----------
  function start(){
    document.getElementById('titleScreen').classList.add('hidden');
    document.getElementById('overScreen').classList.add('hidden');
    const ea = document.getElementById('enrageAlert');
    ea.classList.remove('show');
    ea.classList.add('hidden');
    const dv = document.getElementById('dangerVignette');
    dv.style.opacity = 0;
    dv.classList.remove('pulse');
    document.getElementById('overTitle').classList.remove('clear');
    newGame();
    running = true; paused=false;
    lastT = 0;
  }

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('statusIcon').addEventListener('click', (e)=>{
    e.stopPropagation();
    document.getElementById('statusWrap').classList.toggle('active');
  });
  document.addEventListener('click', (e)=>{
    const wrap = document.getElementById('statusWrap');
    if(!wrap.contains(e.target)) wrap.classList.remove('active');
  });
  document.getElementById('retryBtn').addEventListener('click', start);

  function buildCharSelect(){
    const wrap = document.getElementById('charSelect');
    if(!wrap) return;
    wrap.innerHTML = CHARACTERS.map(c=>`
      <div class="char-card${c.id===selectedCharacter?' selected':''}" data-char="${c.id}" style="--char-color:${c.color}">
        <div class="char-icon" style="color:${c.color}">${c.icon}</div>
        <div class="char-name">${c.name}</div>
        <div class="char-desc">${c.desc}</div>
      </div>`).join('');
  }
  document.getElementById('charSelect').addEventListener('click', (e)=>{
    const card = e.target.closest('.char-card');
    if(!card) return;
    selectedCharacter = parseInt(card.dataset.char, 10);
    document.querySelectorAll('.char-card').forEach(el=> el.classList.toggle('selected', parseInt(el.dataset.char,10)===selectedCharacter));
  });
  buildCharSelect();

  buildTrophyBar();
  document.getElementById('trophyBar').addEventListener('click', (e)=>{
    const slot = e.target.closest('.trophy-slot');
    if(!slot) return;
    e.stopPropagation();
    const wasActive = slot.classList.contains('active');
    document.querySelectorAll('.trophy-slot').forEach(s=>s.classList.remove('active'));
    if(!wasActive) slot.classList.add('active');
  });
  document.getElementById('resultTrophies').addEventListener('click', (e)=>{
    const slot = e.target.closest('.trophy-slot');
    if(!slot) return;
    e.stopPropagation();
    const wasActive = slot.classList.contains('active');
    document.querySelectorAll('.trophy-slot').forEach(s=>s.classList.remove('active'));
    if(!wasActive) slot.classList.add('active');
  });
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('.trophy-slot')){
      document.querySelectorAll('.trophy-slot').forEach(s=>s.classList.remove('active'));
    }
  });
  updateTrophyUI();

  buildUniqueBar();
  document.getElementById('uniqueBar').addEventListener('click', (e)=>{
    const slot = e.target.closest('.unique-slot.active');
    if(!slot) return;
    e.stopPropagation();
    const wasTapped = slot.classList.contains('tapped');
    document.querySelectorAll('.unique-slot').forEach(s=>s.classList.remove('tapped'));
    if(!wasTapped) slot.classList.add('tapped');
  });
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('.unique-slot')){
      document.querySelectorAll('.unique-slot').forEach(s=>s.classList.remove('tapped'));
    }
  });

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
